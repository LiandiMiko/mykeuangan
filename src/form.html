<!-- ================= FORM TRANSAKSI ================= -->
<section id="view-form-transaction" class="view-section hide fade-in">
  <div class="max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200/80 dark:border-slate-800 p-5 sm:p-8 md:p-10 mx-auto transition-colors">
    <div class="flex items-center justify-between gap-3 mb-6 sm:mb-8 border-b border-slate-100 dark:border-slate-800 pb-5 flex-wrap">
      <div class="flex items-center gap-3">
        <button type="button" onclick="switchView('dashboard')" class="w-10 h-10 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 transition-all active:scale-95">
          <i class="ph ph-arrow-left text-xl" aria-hidden="true"></i>
        </button>
        <h2 id="formTitle" class="text-xl sm:text-2xl font-extrabold text-slate-800 dark:text-white tracking-tight">Input Data</h2>
      </div>
      <div>
        <button type="button" id="btnScanReceipt" onclick="triggerReceiptOcr()" class="min-h-11 px-3.5 py-2 brand-gradient text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm hover:opacity-95 transition-all">
          <i class="ph ph-camera text-base" aria-hidden="true"></i> <span data-i18n="form.scan_receipt">Scan Struk (AI)</span>
        </button>
        <input type="file" id="trReceiptInput" accept="image/*" capture="environment" class="hidden" onchange="handleReceiptOcrFile(event)">
      </div>
    </div>
    <form id="formTransaction" onsubmit="submitTransaction(event)">
      <input type="hidden" id="tr_tipe">
      <input type="hidden" id="tr_action">
      <input type="hidden" id="tr_row">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6 mb-5 sm:mb-6">
        <div>
          <label class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500" data-i18n="form.tanggal">Tanggal</label>
          <input type="text" id="tr_tanggal" required class="w-full min-h-12 px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-brand font-medium text-slate-800 dark:text-white">
        </div>
        <div>
          <label class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500" data-i18n="form.kategori">Kategori</label>
          <div class="flex gap-2">
            <select id="tr_kategori" required class="flex-1 min-w-0 min-h-12 px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-brand font-medium text-slate-800 dark:text-white appearance-none"></select>
            <button type="button" onclick="promptAddCategory()" aria-label="Tambah kategori" title="Tambah kategori" data-i18n-aria-label="form.add_category" data-i18n-title="form.add_category" class="w-12 h-12 shrink-0 flex items-center justify-center bg-emerald-700 text-white hover:bg-emerald-800 active:bg-emerald-900 rounded-xl transition-colors">
              <i class="ph-bold ph-plus" aria-hidden="true"></i>
            </button>
            <button type="button" onclick="openManageCategoriesModal()" aria-label="Kelola kategori" title="Kelola kategori" data-i18n-aria-label="form.manage_category" data-i18n-title="form.manage_category" class="w-12 h-12 shrink-0 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-colors border border-slate-200 dark:border-slate-700">
              <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="mb-5 sm:mb-6">
        <label id="tr_wallet_label" class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500">Dompet</label>
        <select id="tr_wallet" class="w-full min-h-12 px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-brand text-slate-800 dark:text-white font-semibold"></select>
      </div>
      <div class="mb-5 sm:mb-6">
        <label class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500" data-i18n="form.nominal">Nominal Transaksi (Rp)</label>
        <div class="relative">
          <span class="absolute left-5 top-1/2 -translate-y-1/2 font-bold text-slate-400">Rp</span>
          <input type="text" id="tr_nominal" inputmode="numeric" autocomplete="off" required placeholder="0" class="w-full pl-14 pr-5 py-4 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-brand text-2xl sm:text-3xl font-black text-slate-800 dark:text-white tabular-nums">
        </div>
        <div class="mt-2.5 flex flex-wrap items-center gap-1.5">
          <button type="button" onclick="addQuickNominalAmount(25000)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand/10 hover:text-brand dark:hover:text-brand-ink text-xs font-bold text-slate-600 dark:text-slate-300 transition-colors">+25rb</button>
          <button type="button" onclick="addQuickNominalAmount(50000)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand/10 hover:text-brand dark:hover:text-brand-ink text-xs font-bold text-slate-600 dark:text-slate-300 transition-colors">+50rb</button>
          <button type="button" onclick="addQuickNominalAmount(100000)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand/10 hover:text-brand dark:hover:text-brand-ink text-xs font-bold text-slate-600 dark:text-slate-300 transition-colors">+100rb</button>
          <button type="button" onclick="addQuickNominalAmount(500000)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand/10 hover:text-brand dark:hover:text-brand-ink text-xs font-bold text-slate-600 dark:text-slate-300 transition-colors">+500rb</button>
          <button type="button" onclick="resetQuickNominalAmount()" class="px-2.5 py-1.5 rounded-lg bg-rose-50 dark:bg-rose-500/10 hover:bg-rose-100 text-xs font-bold text-rose-600 dark:text-rose-400 transition-colors ml-auto">Reset</button>
        </div>
      </div>
      <div class="mb-5 sm:mb-6">
        <label class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500" data-i18n="form.catatan">Catatan Opsional</label>
        <textarea id="tr_keterangan" rows="3" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-brand resize-none font-medium text-slate-800 dark:text-white"></textarea>
      </div>
      <div id="splitBillBox" class="mb-6 sm:mb-8 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-800">
        <label class="flex items-center gap-2.5 text-xs font-bold text-slate-700 dark:text-slate-200">
          <input type="checkbox" id="tr_split_enable" onchange="toggleSplitBillFields()" class="w-4 h-4 rounded accent-brand">
          <span>Split Bill / Patungan (catatkan porsi teman otomatis ke Piutang)</span>
        </label>
        <div id="tr_split_fields" class="hide grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3 pt-3 border-t border-slate-200 dark:border-slate-700">
          <div>
            <label for="tr_split_person" class="block text-[11px] font-bold text-slate-500 mb-1">Nama Teman (Piutang)</label>
            <input type="text" id="tr_split_person" list="tr_split_person_list" maxlength="60" placeholder="Mis. Budi" class="w-full px-3.5 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-brand">
            <datalist id="tr_split_person_list"></datalist>
          </div>
          <div>
            <label for="tr_split_amount" class="block text-[11px] font-bold text-slate-500 mb-1">Porsi Teman (Rp)</label>
            <input type="text" id="tr_split_amount" inputmode="numeric" autocomplete="off" placeholder="Mis. 50.000" class="w-full px-3.5 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-brand tabular-nums">
          </div>
        </div>
      </div>
      <button id="btnSubmitTrans" type="submit" class="w-full min-h-[52px] text-white font-bold py-3.5 rounded-2xl shadow-xl transition-all hover:opacity-90 active:scale-95 flex items-center justify-center gap-2">
        <i class="ph-bold ph-check-circle text-xl" aria-hidden="true"></i> <span data-i18n="form.btn_save">Simpan Transaksi</span>
      </button>
    </form>
  </div>
</section>
