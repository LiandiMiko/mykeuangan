<!-- ================= FORM TRANSAKSI ================= -->
<section id="view-form-transaction" class="view-section hide fade-in">
  <div class="max-w-2xl bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-sm border border-slate-100 dark:border-slate-800 p-8 md:p-12 mx-auto transition-colors">
    <div class="flex items-center gap-3 mb-8 border-b border-slate-100 dark:border-slate-800 pb-6">
      <button onclick="switchView('dashboard')" class="w-10 h-10 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 transition-all active:scale-95">
        <i class="ph ph-arrow-left text-xl"></i>
      </button>
      <h2 id="formTitle" class="text-2xl font-bold text-slate-800 dark:text-white">Input Data</h2>
    </div>
    <form id="formTransaction" onsubmit="submitTransaction(event)">
      <input type="hidden" id="tr_tipe">
      <input type="hidden" id="tr_action">
      <input type="hidden" id="tr_row">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500" data-i18n="form.tanggal">Tanggal</label>
          <input type="text" id="tr_tanggal" required class="w-full px-4 py-4 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-brand font-medium text-slate-800 dark:text-white">
        </div>
        <div>
          <label class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500" data-i18n="form.kategori">Kategori</label>
          <div class="flex gap-2">
            <select id="tr_kategori" required class="flex-1 px-4 py-4 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-brand font-medium text-slate-800 dark:text-white appearance-none"></select>
            <button type="button" onclick="promptAddCategory()" class="px-5 py-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-2xl transition-colors">
              <i class="ph ph-plus-bold"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="mb-6">
        <label class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500" data-i18n="form.nominal">Nominal Transaksi (Rp)</label>
        <div class="relative">
          <span class="absolute left-5 top-1/2 -translate-y-1/2 font-bold text-slate-400">Rp</span>
          <input type="number" id="tr_nominal" required min="1" class="w-full pl-14 pr-6 py-5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-brand text-3xl font-black text-slate-800 dark:text-white">
        </div>
      </div>
      <div class="mb-10">
        <label class="block text-xs font-bold mb-2 uppercase tracking-widest text-slate-500" data-i18n="form.catatan">Catatan Opsional</label>
        <textarea id="tr_keterangan" rows="3" class="w-full px-5 py-4 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-brand resize-none font-medium text-slate-800 dark:text-white"></textarea>
      </div>
      <button id="btnSubmitTrans" type="submit" class="w-full text-white font-bold py-5 rounded-2xl shadow-xl transition-all hover:opacity-90 active:scale-95 flex items-center justify-center gap-2">
        <i class="ph ph-lock-key-bold text-xl"></i> <span data-i18n="form.btn_save">Enkripsi &amp; Simpan</span>
      </button>
    </form>
  </div>
</section>
