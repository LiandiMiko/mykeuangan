<!-- ================= LAPORAN ================= -->
<section id="view-laporan" class="view-section hide fade-in" aria-labelledby="reportTitle">
  <div class="mb-4 sm:mb-6 flex flex-col lg:flex-row lg:items-center justify-between gap-3 sm:gap-4">
    <div class="flex items-center sm:items-start gap-2.5 sm:gap-3">
      <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl sm:rounded-2xl bg-brand/10 text-brand dark:text-brand-ink flex items-center justify-center shrink-0">
        <i class="ph ph-file-pdf text-lg sm:text-2xl" aria-hidden="true"></i>
      </div>
      <div>
        <h2 id="reportTitle" class="text-lg sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight" data-i18n="lap.title">Semua Data</h2>
        <p class="hidden sm:block text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1" data-i18n="lap.subtitle">Cari dan saring transaksi dalam rentang tanggal.</p>
      </div>
    </div>
    <div class="grid grid-cols-2 sm:flex flex-wrap items-center gap-2 w-full lg:w-auto">
      <button type="button" data-action="openFinancialStatementModal" title="Lihat dan Cetak Lembar Ringkasan Finansial 1 Halaman" class="min-h-11 px-3 sm:px-4 py-2 bg-brand hover:bg-brand-hover text-white rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-sm transition-colors">
        <i class="ph ph-file-text shrink-0" aria-hidden="true"></i><span class="truncate" data-i18n="lap.financial_statement">Ringkasan Cetak</span>
      </button>
      <button type="button" data-action="openAnnualRecapModal" title="Ringkasan Tahunan & Perbandingan Siklus" class="min-h-11 px-3 sm:px-4 py-2 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:border-brand rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 border border-slate-200 dark:border-slate-700 transition-colors mk-card-surface">
        <i class="ph ph-calendar-blank shrink-0" aria-hidden="true"></i><span class="truncate" data-i18n="lap.annual_recap">Rekap Tahunan</span>
      </button>

      <details id="lapImportMenu" class="relative">
        <summary class="release-summary list-none cursor-pointer w-full min-h-11 px-3 sm:px-4 py-2 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:border-brand rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 border border-slate-200 dark:border-slate-700 transition-colors select-none mk-card-surface">
          <i class="ph ph-upload-simple shrink-0" aria-hidden="true"></i>
          <span class="truncate" data-i18n="lap.import_menu">Impor &amp; Aturan</span>
          <i class="ph ph-caret-down mk-caret text-xs opacity-70 shrink-0" aria-hidden="true"></i>
        </summary>
        <div class="mk-dropdown-panel absolute left-0 sm:left-auto sm:right-0 mt-2 w-56 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-xl p-1.5 z-30 space-y-1">
          <button type="button" id="lapImportBtn" class="w-full px-3 py-2.5 rounded-xl text-left text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-brand/10 hover:text-brand dark:hover:text-brand-ink flex items-center gap-2">
            <i class="ph ph-file-arrow-up text-base" aria-hidden="true"></i><span data-i18n="lap.import">Impor CSV / Bank</span>
          </button>
          <button type="button" data-action="downloadTransactionTemplate" class="w-full px-3 py-2.5 rounded-xl text-left text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2">
            <i class="ph ph-download-simple text-base" aria-hidden="true"></i><span data-i18n="lap.template">Unduh Template CSV</span>
          </button>
          <button type="button" data-action="triggerRestoreJson" class="w-full px-3 py-2.5 rounded-xl text-left text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2">
            <i class="ph ph-clock-counter-clockwise text-base" aria-hidden="true"></i><span data-i18n="lap.restore_json">Restore Backup JSON</span>
          </button>
          <button type="button" data-action="openAutoCatRulesModal" class="w-full px-3 py-2.5 rounded-xl text-left text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2">
            <i class="ph ph-magic-wand text-base" aria-hidden="true"></i><span data-i18n="lap.auto_rules">Aturan Auto-Kategori</span>
          </button>
        </div>
      </details>

      <details id="lapExportMenu" class="relative">
        <summary class="release-summary list-none cursor-pointer w-full min-h-11 px-3 sm:px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-sm transition-colors select-none">
          <i class="ph ph-export shrink-0" aria-hidden="true"></i>
          <span class="truncate" data-i18n="lap.export_menu">Ekspor &amp; Backup</span>
          <i class="ph ph-caret-down mk-caret text-xs opacity-80 shrink-0" aria-hidden="true"></i>
        </summary>
        <div class="mk-dropdown-panel absolute right-0 mt-2 w-52 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-xl p-1.5 z-30 space-y-1">
          <button type="button" data-action="exportCSV" class="w-full px-3 py-2.5 rounded-xl text-left text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-emerald-50 dark:hover:bg-emerald-500/10 flex items-center gap-2">
            <i class="ph ph-file-csv text-base text-emerald-600" aria-hidden="true"></i><span data-i18n="lap.export_csv">Ekspor CSV</span>
          </button>
          <button type="button" data-action="exportExcel" class="w-full px-3 py-2.5 rounded-xl text-left text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-teal-50 dark:hover:bg-teal-500/10 flex items-center gap-2">
            <i class="ph ph-file-xls text-base text-teal-600" aria-hidden="true"></i><span data-i18n="lap.export_excel">Ekspor Excel (.xls)</span>
          </button>
          <button type="button" data-action="exportPDF" class="w-full px-3 py-2.5 rounded-xl text-left text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-rose-50 dark:hover:bg-rose-500/10 flex items-center gap-2">
            <i class="ph ph-file-pdf text-base text-rose-600" aria-hidden="true"></i><span data-i18n="lap.export">Ekspor PDF</span>
          </button>
          <button type="button" data-action="exportBackupJson" class="w-full px-3 py-2.5 rounded-xl text-left text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2">
            <i class="ph ph-database text-base text-brand" aria-hidden="true"></i><span data-i18n="lap.backup_json">Unduh Backup JSON</span>
          </button>
        </div>
      </details>

      <input id="lapRestoreJsonInput" type="file" accept=".json,application/json" class="hidden" data-action="handleRestoreJsonFile" data-args='["$event"]' data-action-on="change" aria-label="Restore JSON">
      <input id="lapCsvInput" type="file" accept=".csv,text/csv" class="hidden" data-i18n-aria-label="lap.import" aria-label="Impor CSV">
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl mk-card-surface border border-slate-200/80 dark:border-slate-800 p-4 sm:p-6 mb-4 sm:mb-5 transition-colors">

    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-3">
      <div class="sm:col-span-2 xl:col-span-1">
        <label for="lapSearch" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.search">Cari transaksi</label>
        <input id="lapSearch" type="search" enterkeyhint="search" maxlength="100" autocomplete="off" class="w-full min-h-[46px] px-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-800 dark:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand">
      </div>
      <div>
        <label for="lapStart" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.start">Dari tanggal</label>
        <input id="lapStart" type="date" class="w-full min-h-[46px] px-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-800 dark:text-white">
      </div>
      <div>
        <label for="lapEnd" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.end">Sampai tanggal</label>
        <input id="lapEnd" type="date" class="w-full min-h-[46px] px-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-800 dark:text-white">
      </div>
      <div>
        <label for="lapType" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.type">Tipe</label>
        <select id="lapType" class="w-full min-h-[46px] px-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-800 dark:text-white">
          <option value="" data-i18n="lap.all_types">Semua tipe</option>
          <option value="Pemasukan" data-i18n="lap.income">Pemasukan</option>
          <option value="Pengeluaran" data-i18n="lap.expense">Pengeluaran</option>
        </select>
      </div>
      <div>
        <label for="lapCategory" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.category">Kategori</label>
        <select id="lapCategory" class="w-full min-h-[46px] px-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-800 dark:text-white"></select>
      </div>
      <div>
        <label for="lapWallet" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.wallet">Dompet</label>
        <select id="lapWallet" class="w-full min-h-[46px] px-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-800 dark:text-white"></select>
      </div>
    </div>
    <div id="lapTagBar" class="hide mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center gap-1.5"></div>
    <div class="mt-3 flex justify-end">
      <button type="button" id="lapResetFilterBtn" data-action="resetReportFilters" class="hide min-h-10 px-3.5 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1.5 transition-colors">
        <i class="ph ph-x-circle text-sm" aria-hidden="true"></i>
        <span data-i18n="filter.reset">Reset Filter</span>
      </button>
    </div>
  </div>

  <div id="lapBulkBar" class="hide mb-4 p-3.5 rounded-2xl bg-brand/10 border border-brand/25 flex flex-wrap items-center justify-between gap-2">
    <p class="text-xs font-bold text-brand dark:text-brand-ink"><span id="lapBulkCount">0</span> <span data-i18n="bulk.selected">dipilih</span></p>
    <div class="flex flex-wrap gap-2">
      <button type="button" data-action="bulkEditReportCategory" class="min-h-10 px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:border-brand" data-i18n="bulk.change_cat">Ubah Kategori</button>
      <button type="button" data-action="bulkEditReportWallet" class="min-h-10 px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:border-brand" data-i18n="bulk.change_wallet">Ubah Dompet</button>
      <button type="button" data-action="bulkDeleteReportRows" class="min-h-10 px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold" data-i18n="bulk.delete">Hapus Terpilih</button>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl border border-slate-200/80 dark:border-slate-800 mk-card-surface overflow-hidden transition-colors">
    <p id="lapStatus" role="status" aria-live="polite" class="px-4 sm:px-5 pt-4 text-xs text-slate-500 dark:text-slate-400"></p>
    <div class="md:hidden px-4 py-3 bg-slate-50/80 dark:bg-slate-800/40 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2">
      <label class="flex items-center gap-2 text-xs font-bold text-slate-600 dark:text-slate-300">
        <input type="checkbox" id="lapSelectAllMobile" data-action="toggleSelectAllReport" data-args='["$checked"]' data-action-on="change" aria-label="Pilih semua transaksi di halaman ini" class="w-4 h-4 rounded accent-brand">
        <span data-i18n="lap.select_all">Pilih semua di halaman ini</span>
      </label>
    </div>
    <div id="list-laporan-mobile" class="md:hidden divide-y divide-slate-100 dark:divide-slate-800"></div>
    <div class="hidden md:block overflow-x-auto">
      <table class="w-full text-left min-w-[840px]">
        <thead class="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 text-[10px] uppercase font-bold tracking-widest border-b border-slate-100 dark:border-slate-800">
          <tr>
            <th class="px-4 py-5 w-10"><input type="checkbox" id="lapSelectAll" data-action="toggleSelectAllReport" data-args='["$checked"]' data-action-on="change" aria-label="Pilih semua transaksi di halaman ini" class="w-4 h-4 rounded accent-brand"></th>
            <th class="px-6 py-5" data-i18n="lap.col_tgl">Tanggal</th>
            <th class="px-6 py-5" data-i18n="lap.col_tipe">Tipe</th>
            <th class="px-6 py-5" data-i18n="lap.col_kat">Kategori</th>
            <th class="px-6 py-5" data-i18n="lap.col_wallet">Dompet</th>
            <th class="px-6 py-5" data-i18n="lap.col_catatan">Catatan</th>
            <th class="px-6 py-5 text-right" data-i18n="lap.col_nominal">Nominal</th>
            <th class="px-6 py-5 text-center" data-i18n="lap.col_aksi">Aksi</th>
          </tr>
        </thead>
        <tbody id="table-laporan" class="divide-y divide-slate-100 dark:divide-slate-800 text-sm text-slate-700 dark:text-slate-300"></tbody>
      </table>
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 border-t border-slate-100 dark:border-slate-800">
      <p id="lapPageStatus" class="text-xs text-slate-500 dark:text-slate-400" aria-live="polite"></p>
      <div class="grid grid-cols-2 sm:flex items-center gap-2">
        <button type="button" id="lapPrev" data-i18n="lap.previous" class="min-h-[44px] px-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-200 disabled:opacity-50">Sebelumnya</button>
        <button type="button" id="lapNext" data-i18n="lap.next" class="min-h-[44px] px-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-200 disabled:opacity-50">Berikutnya</button>
      </div>
    </div>
  </div>
</section>
