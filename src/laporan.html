<!-- ================= LAPORAN ================= -->
<section id="view-laporan" class="view-section hide fade-in">
  <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 transition-colors">
    <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
      <h3 class="font-bold text-xl text-slate-800 dark:text-white self-center hidden md:block mr-4" data-i18n="lap.title">Semua Data</h3>
      <button onclick="exportPDF()" class="w-full md:w-auto bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700 transition-all">
        <i class="ph ph-file-pdf"></i> <span data-i18n="lap.export">Ekspor PDF</span>
      </button>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden transition-colors">
    <div class="overflow-x-auto">
      <table class="w-full text-left min-w-[800px]">
        <thead class="bg-slate-50 dark:bg-slate-950 text-slate-400 dark:text-slate-500 text-[10px] uppercase font-bold tracking-widest border-b border-slate-100 dark:border-slate-800">
          <tr>
            <th class="px-6 py-5" data-i18n="lap.col_tgl">Tanggal</th>
            <th class="px-6 py-5" data-i18n="lap.col_tipe">Tipe</th>
            <th class="px-6 py-5" data-i18n="lap.col_kat">Kategori</th>
            <th class="px-6 py-5" data-i18n="lap.col_catatan">Catatan</th>
            <th class="px-6 py-5 text-right" data-i18n="lap.col_nominal">Nominal</th>
            <th class="px-6 py-5 text-center" data-i18n="lap.col_aksi">Aksi</th>
          </tr>
        </thead>
        <tbody id="table-laporan" class="divide-y divide-slate-50 dark:divide-slate-800 text-sm text-slate-700 dark:text-slate-300"></tbody>
      </table>
    </div>
  </div>
</section>
