<!-- ================= LAPORAN ================= -->
<section id="view-laporan" class="view-section hide fade-in" aria-labelledby="reportTitle">
  <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 p-5 sm:p-6 mb-5 transition-colors">
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-5">
      <div>
        <h2 id="reportTitle" class="font-bold text-xl sm:text-2xl text-slate-800 dark:text-white" data-i18n="lap.title">Semua Data</h2>
        <p class="text-xs text-slate-500 mt-1" data-i18n="lap.subtitle">Cari dan saring transaksi dalam rentang tanggal.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button type="button" onclick="downloadTransactionTemplate()" class="min-h-[44px] px-4 py-2 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:border-brand rounded-xl font-bold text-sm flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700">
          <i class="ph ph-download-simple" aria-hidden="true"></i><span data-i18n="lap.template">Template CSV</span>
        </button>
        <button type="button" id="lapImportBtn" class="min-h-[44px] px-4 py-2 bg-brand text-white hover:bg-brand-hover rounded-xl font-bold text-sm flex items-center justify-center gap-2">
          <i class="ph ph-upload-simple" aria-hidden="true"></i><span data-i18n="lap.import">Impor CSV</span>
        </button>
        <button type="button" onclick="exportCSV()" class="min-h-[44px] px-4 py-2 bg-emerald-700 text-white hover:bg-emerald-800 rounded-xl font-bold text-sm flex items-center justify-center gap-2">
          <i class="ph ph-file-csv" aria-hidden="true"></i><span data-i18n="lap.export_csv">Ekspor CSV</span>
        </button>
        <button type="button" onclick="exportExcel()" class="min-h-[44px] px-4 py-2 bg-teal-700 text-white hover:bg-teal-800 rounded-xl font-bold text-sm flex items-center justify-center gap-2">
          <i class="ph ph-file-xls" aria-hidden="true"></i><span data-i18n="lap.export_excel">Ekspor Excel</span>
        </button>
        <button type="button" onclick="exportPDF()" class="min-h-[44px] px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl font-bold text-sm flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700">
          <i class="ph ph-file-pdf" aria-hidden="true"></i><span data-i18n="lap.export">Ekspor PDF</span>
        </button>
        <button type="button" onclick="exportBackupJson()" class="min-h-[44px] px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:border-brand rounded-xl font-bold text-sm flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700">
          <i class="ph ph-database" aria-hidden="true"></i><span data-i18n="lap.backup_json">Backup JSON</span>
        </button>
        <input id="lapCsvInput" type="file" accept=".csv,text/csv" class="hidden" data-i18n-aria-label="lap.import" aria-label="Impor CSV">
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-3">
      <div class="sm:col-span-2 xl:col-span-1">
        <label for="lapSearch" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.search">Cari transaksi</label>
        <input id="lapSearch" type="search" maxlength="100" autocomplete="off" class="w-full min-h-[44px] px-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand">
      </div>
      <div>
        <label for="lapStart" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.start">Dari tanggal</label>
        <input id="lapStart" type="date" class="w-full min-h-[44px] px-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white">
      </div>
      <div>
        <label for="lapEnd" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.end">Sampai tanggal</label>
        <input id="lapEnd" type="date" class="w-full min-h-[44px] px-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white">
      </div>
      <div>
        <label for="lapType" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.type">Tipe</label>
        <select id="lapType" class="w-full min-h-[44px] px-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white">
          <option value="" data-i18n="lap.all_types">Semua tipe</option>
          <option value="Pemasukan" data-i18n="lap.income">Pemasukan</option>
          <option value="Pengeluaran" data-i18n="lap.expense">Pengeluaran</option>
        </select>
      </div>
      <div>
        <label for="lapCategory" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.category">Kategori</label>
        <select id="lapCategory" class="w-full min-h-[44px] px-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white"></select>
      </div>
      <div>
        <label for="lapWallet" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1" data-i18n="lap.wallet">Dompet</label>
        <select id="lapWallet" class="w-full min-h-[44px] px-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white"></select>
      </div>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden transition-colors">
    <p id="lapStatus" role="status" aria-live="polite" class="px-5 pt-4 text-xs text-slate-500 dark:text-slate-400"></p>
    <div class="overflow-x-auto">
      <table class="w-full text-left min-w-[800px]">
        <thead class="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 text-[10px] uppercase font-bold tracking-widest border-b border-slate-100 dark:border-slate-800">
          <tr>
            <th class="px-6 py-5" data-i18n="lap.col_tgl">Tanggal</th>
            <th class="px-6 py-5" data-i18n="lap.col_tipe">Tipe</th>
            <th class="px-6 py-5" data-i18n="lap.col_kat">Kategori</th>
            <th class="px-6 py-5" data-i18n="lap.col_wallet">Dompet</th>
            <th class="px-6 py-5" data-i18n="lap.col_catatan">Catatan</th>
            <th class="px-6 py-5 text-right" data-i18n="lap.col_nominal">Nominal</th>
            <th class="px-6 py-5 text-center" data-i18n="lap.col_aksi">Aksi</th>
          </tr>
        </thead>
        <tbody id="table-laporan" class="divide-y divide-slate-100 dark:divide-slate-800 text-sm text-slate-700 dark:text-slate-300"></tbody>
      </table>
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 border-t border-slate-100 dark:border-slate-800">
      <p id="lapPageStatus" class="text-xs text-slate-500 dark:text-slate-400" aria-live="polite"></p>
      <div class="flex items-center gap-2">
        <button type="button" id="lapPrev" data-i18n="lap.previous" class="min-h-[44px] px-4 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-200 disabled:opacity-50">Sebelumnya</button>
        <button type="button" id="lapNext" data-i18n="lap.next" class="min-h-[44px] px-4 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-200 disabled:opacity-50">Berikutnya</button>
      </div>
    </div>
  </div>
</section>
