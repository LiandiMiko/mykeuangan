<script>
/* ============================================================
   FEATURES v2.1–v3.0 MODULAR ENHANCEMENTS
   - Receipt OCR Scanner (On-Demand Gemini Vision)
   - AI Financial Chat & Installment Simulator (On-Demand)
   - Budgeting Charts (Category Donut + 6-Month Cashflow Bar)
   - Financial Goal Monthly Saving Calculator
   - Header Notification Bell Center
   - Gold (Emas), USD, & Stock Asset Support
   - Excel (.xls) Export
   - Debt Due Dates (Jatuh Tempo) & Installment History
   - PWA Offline Transaction Queue & Auto-Sync
   ============================================================ */
(function () {
  'use strict';

  const OFFLINE_QUEUE_KEY = 'mk_offline_tx_queue_v1';
  const IDB_NAME = 'mykeuangan_offline_db';
  const IDB_STORE = 'pending_transactions';
  const LAST_SEEN_RELEASE_KEY = 'mk_last_seen_release';

  let budgetCategoryChartInstance = null;
  let budgetCashflowChartInstance = null;
  let activeUpdatesTopic = 'all';

  /* ---------------- Offline Queue Storage (IndexedDB + localStorage mirror) ---------------- */
  function readLocalQueue() {
    try {
      const raw = localStorage.getItem(OFFLINE_QUEUE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      return [];
    }
  }

  function writeLocalQueue(items) {
    try {
      localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(items || []));
    } catch (_) {}
  }

  function openOfflineDb() {
    if (!window.indexedDB) return Promise.resolve(null);
    return new Promise((resolve) => {
      try {
        const req = window.indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'localId' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch (_) {
        resolve(null);
      }
    });
  }

  async function saveOfflineQueueItem(item) {
    const list = readLocalQueue().filter((x) => x.localId !== item.localId);
    list.push(item);
    writeLocalQueue(list);

    const db = await openOfflineDb();
    if (!db) return;
    try {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(item);
    } catch (_) {}
  }

  async function removeOfflineQueueItem(localId) {
    writeLocalQueue(readLocalQueue().filter((x) => x.localId !== localId));
    const db = await openOfflineDb();
    if (!db) return;
    try {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(localId);
    } catch (_) {}
  }

  async function getOfflineQueueItems() {
    const db = await openOfflineDb();
    if (!db) return readLocalQueue();
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).getAll();
        req.onsuccess = () => {
          const idbItems = Array.isArray(req.result) ? req.result : [];
          if (idbItems.length) writeLocalQueue(idbItems);
          resolve(idbItems.length ? idbItems : readLocalQueue());
        };
        req.onerror = () => resolve(readLocalQueue());
      } catch (_) {
        resolve(readLocalQueue());
      }
    });
  }

  function isNetworkOfflineError(err) {
    if (!navigator.onLine) return true;
    const msg = String((err && err.message) || err || '').toLowerCase();
    return msg.includes('failed to fetch') || msg.includes('networkerror') || msg.includes('load failed');
  }

  let isFlushingOffline = false;
  window.flushOfflineQueue = async function (silent) {
    if (isFlushingOffline || !navigator.onLine) return 0;
    const queue = await getOfflineQueueItems();
    if (!queue.length) return 0;

    isFlushingOffline = true;
    let synced = 0;
    const addedTransactions = [];
    let latestPeriod = '';
    try {
      for (const item of queue) {
        try {
          const payload = Object.assign({}, item.payload);
          const res = await window._rawCallServer('api_addTransaction', payload);
          if (res && res.transaction) addedTransactions.push(res.transaction);
          if (res && res.currentPeriod && (!latestPeriod || res.currentPeriod > latestPeriod)) {
            latestPeriod = res.currentPeriod;
          }
          await removeOfflineQueueItem(item.localId);
          if (typeof DB !== 'undefined' && Array.isArray(DB.transactions)) {
            DB.transactions = DB.transactions.filter((tx) => tx.id !== item.localId);
          }
          synced += 1;
        } catch (err) {
          if (isNetworkOfflineError(err)) break;
        }
      }
      if (synced > 0 && typeof refreshFromServer === 'function') {
        await refreshFromServer({
          addedTransactions,
          ...(latestPeriod ? { currentPeriod: latestPeriod } : {})
        });
      }
      if (synced > 0 && !silent && typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'success',
          title: synced + ' transaksi offline tersinkronisasi',
          timer: 1600,
          showConfirmButton: false,
          customClass: { popup: getSwalClass() }
        });
      }
    } finally {
      isFlushingOffline = false;
      refreshNotificationBell();
    }
    return synced;
  };

  /* Wrap callServer so initial data loads debtDueDates and offline transactions queue cleanly */
  const waitAndWrapCallServer = () => {
    if (typeof window.callServer !== 'function' || window._rawCallServer) return;
    window._rawCallServer = window.callServer;
    window.callServer = async function (fn, ...args) {
      if (fn === 'api_addTransaction' && !navigator.onLine) {
        const txPayload = Object.assign({}, args[0] || {});
        const localId = 'offline-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
        await saveOfflineQueueItem({ localId, payload: txPayload, createdAt: new Date().toISOString() });
        setTimeout(refreshNotificationBell, 50);
        return {
          _offlineQueued: true,
          transaction: {
            id: localId,
            tanggal: txPayload.tanggal,
            tipe: txPayload.tipe,
            kategori: txPayload.kategori,
            nominal: Number(txPayload.nominal) || 0,
            keterangan: (txPayload.keterangan ? txPayload.keterangan + ' ' : '') + '[Offline Queue]',
            walletId: txPayload.walletId || ''
          }
        };
      }
      try {
        const res = await window._rawCallServer(fn, ...args);
        if (fn === 'getInitialData' && res && typeof res === 'object') {
          if (typeof DB !== 'undefined') {
            DB.debtDueDates = res.debtDueDates || {};
          }
          const pending = readLocalQueue();
          if (pending.length && Array.isArray(res.transactions)) {
            pending.forEach((item) => {
              if (!res.transactions.some((x) => x.id === item.localId)) {
                res.transactions.push({
                  id: item.localId,
                  tanggal: item.payload.tanggal,
                  tipe: item.payload.tipe,
                  kategori: item.payload.kategori,
                  nominal: Number(item.payload.nominal) || 0,
                  keterangan: (item.payload.keterangan ? item.payload.keterangan + ' ' : '') + '[Offline Queue]',
                  walletId: item.payload.walletId || ''
                });
              }
            });
          }
        }
        return res;
      } catch (err) {
        if (fn === 'api_addTransaction' && isNetworkOfflineError(err)) {
          const txPayload = Object.assign({}, args[0] || {});
          const localId = 'offline-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
          await saveOfflineQueueItem({ localId, payload: txPayload, createdAt: new Date().toISOString() });
          setTimeout(refreshNotificationBell, 50);
          return {
            _offlineQueued: true,
            transaction: {
              id: localId,
              tanggal: txPayload.tanggal,
              tipe: txPayload.tipe,
              kategori: txPayload.kategori,
              nominal: Number(txPayload.nominal) || 0,
              keterangan: (txPayload.keterangan ? txPayload.keterangan + ' ' : '') + '[Offline Queue]',
              walletId: txPayload.walletId || ''
            }
          };
        }
        if (fn === 'api_savePeriod' && isNetworkOfflineError(err)) {
          return args[0];
        }
        throw err;
      }
    };
  };

  /* ---------------- 1. Receipt OCR Scanner (On-Demand Gemini Vision) ---------------- */
  window.triggerReceiptOcr = async function () {
    let key = typeof getGeminiApiKey === 'function' ? getGeminiApiKey() : (localStorage.getItem('mk_gemini_api_key') || '');
    if (!key && typeof configureGeminiApiKey === 'function') {
      key = await configureGeminiApiKey();
      if (!key) return;
    }
    const input = document.getElementById('trReceiptInput');
    if (input) {
      input.value = '';
      input.click();
    }
  };

  function compressImageToBase64(file) {
    return new Promise((resolve, reject) => {
      if (file.size > 10 * 1024 * 1024) {
        reject(new Error('Ukuran gambar melebihi batas 10 MB.'));
        return;
      }
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => {
          const raw = String(reader.result || '');
          const comma = raw.indexOf(',');
          resolve({ mimeType: file.type || 'image/jpeg', base64: comma >= 0 ? raw.slice(comma + 1) : raw });
        };
        img.onload = () => {
          const maxDim = 1280;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (w > maxDim || h > maxDim) {
            const scale = Math.min(maxDim / w, maxDim / h);
            w = Math.max(1, Math.round(w * scale));
            h = Math.max(1, Math.round(h * scale));
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          resolve({ mimeType: 'image/jpeg', base64: dataUrl.split(',')[1] });
        };
        img.src = String(reader.result || '');
      };
      reader.readAsDataURL(file);
    });
  }

  window.handleReceiptOcrFile = async function (event) {
    const file = event && event.target && event.target.files && event.target.files[0];
    if (!file) return;

    const apiKey = typeof getGeminiApiKey === 'function' ? getGeminiApiKey() : '';
    if (!apiKey) return;

    const btn = document.getElementById('btnScanReceipt');
    if (btn) btn.disabled = true;

    Swal.fire({
      title: 'Membaca struk dengan AI...',
      text: 'Mengekstrak tanggal, nominal, kategori, dan catatan.',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading(),
      customClass: { popup: getSwalClass() }
    });

    try {
      const { mimeType, base64 } = await compressImageToBase64(file);
      const todayStr = typeof localToday === 'function' ? localToday() : new Date().toISOString().slice(0, 10);
      const prompt = FinanceAnalysis.buildReceiptOcrPrompt(DB.categories, todayStr, currentLang);

      const { json } = await callGeminiApi(apiKey, {
        contents: [{
          parts: [
            { text: prompt },
            { inlineData: { mimeType, data: base64 } }
          ]
        }],
        generationConfig: {
          temperature: 0.1,
          responseMimeType: 'application/json'
        }
      });
      const rawText = (((json || {}).candidates || [])[0] || {}).content?.parts?.map((p) => p.text || '').join('') || '';
      const parsed = FinanceAnalysis.parseReceiptOcrResponse(rawText, todayStr);

      document.getElementById('tr_tipe').value = parsed.tipe;
      const submitBtn = document.getElementById('btnSubmitTrans');
      if (submitBtn) {
        submitBtn.className = 'w-full text-white font-bold py-5 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2 ' +
          (parsed.tipe === 'Pemasukan' ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-rose-500 hover:bg-rose-600');
      }
      const tipeKey = parsed.tipe === 'Pemasukan' ? 'form.pemasukan' : 'form.pengeluaran';
      const titleEl = document.getElementById('formTitle');
      if (titleEl) titleEl.innerText = t('form.title_add') + ' ' + t(tipeKey);
      const wl = document.getElementById('tr_wallet_label');
      if (wl) wl.innerText = parsed.tipe === 'Pemasukan' ? 'Masuk ke dompet' : 'Dibayar dari dompet';

      if (typeof syncFormCategorySelect === 'function') {
        const listKey = parsed.tipe === 'Pemasukan' ? 'pemasukan' : 'pengeluaran';
        syncFormCategorySelect();
        const catSelect = document.getElementById('tr_kategori');
        if (catSelect) {
          const opts = DB.categories[listKey] || [];
          const match = opts.find((c) => c.toLowerCase() === parsed.kategori.toLowerCase());
          if (match) catSelect.value = match;
        }
      }

      document.getElementById('tr_tanggal').value = parsed.tanggal;
      if (typeof fpTanggal !== 'undefined' && fpTanggal) {
        try { fpTanggal.setDate(parsed.tanggal, true); } catch (_) {}
      }
      document.getElementById('tr_nominal').value = parsed.nominal;
      document.getElementById('tr_keterangan').value = parsed.keterangan;

      Swal.fire({
        icon: 'success',
        title: 'Struk terbaca!',
        text: 'Periksa kembali isian lalu klik Enkripsi & Simpan.',
        timer: 1800,
        showConfirmButton: false,
        customClass: { popup: getSwalClass() }
      });
    } catch (err) {
      Swal.fire({
        icon: 'error',
        title: 'Gagal membaca struk',
        text: String((err && err.message) || err),
        customClass: { popup: getSwalClass() }
      });
    } finally {
      if (btn) btn.disabled = false;
      if (event && event.target) event.target.value = '';
    }
  };

  /* ---------------- 2. AI Financial Chat & Simulator ---------------- */
  window.fillAiChatPrompt = function (text) {
    const input = document.getElementById('aiChatInput');
    if (input) {
      input.value = text;
      input.focus();
    }
  };

  function formatAiTextSafe(text) {
    return escapeHtmlJS(text).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  }

  window.runAiFinancialChat = async function () {
    const input = document.getElementById('aiChatInput');
    const out = document.getElementById('aiChatResult');
    const btn = document.getElementById('btnAskAiChat');
    const question = ((input && input.value) || '').trim();
    if (!question) {
      if (input) input.focus();
      return;
    }

    let apiKey = typeof getGeminiApiKey === 'function' ? getGeminiApiKey() : '';
    if (!apiKey && typeof configureGeminiApiKey === 'function') {
      apiKey = await configureGeminiApiKey();
      if (!apiKey) return;
    }

    if (btn) btn.disabled = true;
    if (out) {
      out.classList.remove('hide');
      out.innerHTML = '<div class="flex items-center gap-2 text-slate-500"><div class="w-4 h-4 border-2 border-brand border-t-transparent rounded-full animate-spin"></div><span>Gemini sedang menjawab pertanyaan Anda...</span></div>';
    }

    try {
      const payload = FinanceAnalysis.buildAiCashflowPayload(DB, DB.currentPeriod, DB.payrollDay);
      const prompt = FinanceAnalysis.buildAiFinancialChatPrompt(payload, question, currentLang);
      const { json } = await callGeminiApi(apiKey, {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.35 }
      });
      const answer = (((json || {}).candidates || [])[0] || {}).content?.parts?.map((p) => p.text || '').join('') || '';
      if (!answer) throw new Error('Gemini tidak mengembalikan jawaban.');
      if (out) {
        out.innerHTML = `<div class="leading-relaxed space-y-2"><p class="text-[11px] font-bold uppercase tracking-wider text-brand dark:text-brand-ink">Jawaban Gemini AI</p><div>${formatAiTextSafe(answer)}</div></div>`;
      }
    } catch (err) {
      if (out) {
        out.innerHTML = `<p class="text-rose-600 dark:text-rose-400 font-semibold">Gagal meminta jawaban AI: ${escapeHtmlJS(String((err && err.message) || err))}</p>`;
      }
    } finally {
      if (btn) btn.disabled = false;
    }
  };

  /* ---------------- 3. Budgeting Charts (Donut + 6-Month Cashflow Bar) ---------------- */
  window.renderBudgetCharts = function () {
    if (typeof Chart === 'undefined' || typeof isDataReady === 'undefined' || !isDataReady) return;
    const isDark = document.documentElement.classList.contains('dark');
    const textColor = isDark ? '#cbd5e1' : '#475569';
    const gridColor = isDark ? 'rgba(148,163,184,0.12)' : 'rgba(148,163,184,0.2)';
    const brandHex = getComputedStyle(document.documentElement).getPropertyValue('--color-brand').trim() || '#4f46e5';

    // Chart A: Category Spending Donut
    const catCanvas = document.getElementById('budgetCategoryChart');
    const catEmpty = document.getElementById('budgetCategoryChartEmpty');
    if (catCanvas) {
      const summary = FinanceAnalysis.summarizePeriod(DB.budgets, DB.transactions, DB.currentPeriod, DB.payrollDay);
      const nonZero = summary.rows
        .filter((r) => r.actual > 0)
        .sort((a, b) => b.actual - a.actual);

      if (budgetCategoryChartInstance) {
        budgetCategoryChartInstance.destroy();
        budgetCategoryChartInstance = null;
      }

      if (!nonZero.length) {
        catCanvas.style.display = 'none';
        if (catEmpty) catEmpty.classList.remove('hidden');
      } else {
        catCanvas.style.display = 'block';
        if (catEmpty) catEmpty.classList.add('hidden');
        const top = nonZero.slice(0, 6);
        const restSum = nonZero.slice(6).reduce((s, r) => s + r.actual, 0);
        if (restSum > 0) top.push({ category: 'Lainnya', actual: restSum });

        const palette = [brandHex, '#10b981', '#f59e0b', '#ec4899', '#0ea5e9', '#8b5cf6', '#64748b'];
        budgetCategoryChartInstance = new Chart(catCanvas.getContext('2d'), {
          type: 'doughnut',
          data: {
            labels: top.map((r) => r.category),
            datasets: [{
              data: top.map((r) => r.actual),
              backgroundColor: top.map((_, i) => palette[i % palette.length]),
              borderWidth: 2,
              borderColor: isDark ? '#0f172a' : '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '62%',
            plugins: {
              legend: {
                position: 'right',
                labels: { color: textColor, boxWidth: 10, font: { family: 'Inter', size: 11 } }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => ctx.label + ': ' + formatRupiah(ctx.parsed).replace(',00', '')
                }
              }
            }
          }
        });
      }
    }

    // Chart B: 6-Month Cashflow Bar Chart
    const cfCanvas = document.getElementById('budgetCashflowChart');
    const cfEmpty = document.getElementById('budgetCashflowChartEmpty');
    if (cfCanvas) {
      const series = FinanceAnalysis.monthlyCashflowSeries(DB.transactions, DB.currentPeriod, DB.payrollDay, 6);
      const trend = FinanceAnalysis.monthlyTrend(DB.budgets, DB.transactions, DB.currentPeriod, DB.payrollDay, 6);
      const hasAny = series.some((s) => s.incomeTotal > 0 || s.expenseTotal > 0) || trend.some((m) => m.budgetTotal > 0);

      if (budgetCashflowChartInstance) {
        budgetCashflowChartInstance.destroy();
        budgetCashflowChartInstance = null;
      }

      if (!hasAny) {
        cfCanvas.style.display = 'none';
        if (cfEmpty) cfEmpty.classList.remove('hidden');
      } else {
        cfCanvas.style.display = 'block';
        if (cfEmpty) cfEmpty.classList.add('hidden');
        budgetCashflowChartInstance = new Chart(cfCanvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels: series.map((s) => getMonthShort(Number(s.period.slice(5, 7)) - 1) + ' ' + s.period.slice(2, 4)),
            datasets: [
              {
                label: 'Pemasukan',
                data: series.map((s) => s.incomeTotal),
                backgroundColor: '#10b981',
                borderRadius: 6
              },
              {
                label: 'Pengeluaran',
                data: series.map((s) => s.expenseTotal),
                backgroundColor: '#f43f5e',
                borderRadius: 6
              },
              {
                label: 'Budget',
                data: trend.map((m) => m.budgetTotal),
                backgroundColor: brandHex + '66',
                borderColor: brandHex,
                borderWidth: 1.5,
                borderRadius: 6
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { color: textColor, boxWidth: 10, font: { family: 'Inter', size: 11 } } },
              tooltip: {
                callbacks: {
                  label: (ctx) => ctx.dataset.label + ': ' + formatRupiah(ctx.parsed.y).replace(',00', '')
                }
              }
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: textColor, font: { family: 'Inter', size: 10 } } },
              y: {
                grid: { color: gridColor },
                ticks: {
                  color: textColor,
                  font: { family: 'Inter', size: 10 },
                  callback: (val) => typeof formatShortIDR === 'function' ? formatShortIDR(val) : val
                }
              }
            }
          }
        });
      }
    }
  };

  /* ---------------- 4. Release Updates & Notification Bell Center ---------------- */
  function getLatestReleaseMeta() {
    const viewEl = document.getElementById('view-updates');
    return {
      id: (viewEl && viewEl.getAttribute('data-latest-release')) || '',
      version: (viewEl && viewEl.getAttribute('data-latest-version')) || ''
    };
  }

  function hasUnreadRelease() {
    const meta = getLatestReleaseMeta();
    if (!meta.id) return false;
    try {
      return localStorage.getItem(LAST_SEEN_RELEASE_KEY) !== meta.id;
    } catch (_) {
      return false;
    }
  }

  window.refreshUpdatesBadge = function () {
    const meta = getLatestReleaseMeta();
    const verEl = document.getElementById('navUpdatesVersion');
    if (verEl && meta.version) verEl.textContent = meta.version;
    const dotEl = document.getElementById('navUpdatesDot');
    if (dotEl) dotEl.classList.toggle('hide', !hasUnreadRelease());
  };

  window.markLatestReleaseSeen = function () {
    const meta = getLatestReleaseMeta();
    if (!meta.id) return;
    try {
      localStorage.setItem(LAST_SEEN_RELEASE_KEY, meta.id);
    } catch (_) {
      // Storage unavailable (private mode / blocked storage)
    }
    window.refreshUpdatesBadge();
    window.refreshNotificationBell();
  };

  function syncToggleAllReleasesButton() {
    const btn = document.getElementById('btnToggleAllReleases');
    const textEl = document.getElementById('btnToggleAllReleasesText');
    if (!btn || !textEl) return;
    const visibleDetails = Array.from(document.querySelectorAll('#updatesList [data-release-details]'))
      .filter((el) => !el.classList.contains('hide'));
    const allOpen = visibleDetails.length > 0 && visibleDetails.every((el) => el.open);
    const key = allOpen ? 'updates.collapse_all' : 'updates.expand_all';
    textEl.setAttribute('data-i18n', key);
    textEl.textContent = typeof t === 'function' ? t(key) : (allOpen ? 'Tutup Semua' : 'Buka Semua');
  }

  window.setUpdatesTopic = function (topic) {
    activeUpdatesTopic = topic || 'all';
    document.querySelectorAll('[data-updates-topic]').forEach((btn) => {
      const isActive = btn.getAttribute('data-updates-topic') === activeUpdatesTopic;
      btn.classList.toggle('bg-brand', isActive);
      btn.classList.toggle('text-white', isActive);
      btn.classList.toggle('shadow-xs', isActive);
      btn.classList.toggle('bg-slate-100', !isActive);
      btn.classList.toggle('dark:bg-slate-800', !isActive);
      btn.classList.toggle('text-slate-600', !isActive);
      btn.classList.toggle('dark:text-slate-300', !isActive);
    });
    window.filterUpdatesList();
  };

  window.filterUpdatesList = function () {
    const input = document.getElementById('updatesSearchInput');
    const query = String((input && input.value) || '').trim().toLowerCase();
    const cards = Array.from(document.querySelectorAll('#updatesList [data-release-card]'));
    const autoExpand = Boolean(query) || activeUpdatesTopic !== 'all';
    let visibleCount = 0;

    cards.forEach((card) => {
      const topics = String(card.getAttribute('data-topics') || '').split(/\s+/).filter(Boolean);
      const topicMatch = activeUpdatesTopic === 'all' || topics.includes(activeUpdatesTopic);

        card.open = visible && autoExpand;
      }
      if (visible) visibleCount++;
    });

  window.exportExcel = function () {

      Swal.fire({ icon: 'warning', title: 'Kosong', text: 'Tidak ada data untuk diekspor', customClass: { popup: getSwalClass() } });
      return;
    }
    const safeExcelCell = (val) => {
      const s = String(val == null ? '' : val);
      return escapeHtmlJS(/^[=+\-@\t\r]/.test(s) ? ("'" + s) : s);
    };
    const rowsHtml = txs.map((r) => `
      <tr>

        <td>${safeExcelCell(r.kategori)}</td>
        <td>${Number(r.nominal) || 0}</td>
        <td>${safeExcelCell(r.keterangan || '')}</td>
        <td>${safeExcelCell(walletName(r.walletId))}</td>
      </tr>`).join('');

    const tableDoc = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
      <head><meta charset="UTF-8"></head>
      <body>
        <table border="1">
          <thead>
            <tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Nominal (IDR)</th><th>Catatan</th><th>Dompet</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </body></html>`;

    const blob = new Blob(['\ufeff' + tableDoc], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `Laporan_Keuangan_${sessionUser}_${period || 'All'}.xls`;
    anchor.click();

    let totalIn = 0;
    let totalOut = 0;
    let netTransfers = 0;

    const walletTxs = (DB.transactions || []).filter((tx) => {
      const wid = tx.walletId || defaultId;
      return String(wid) === String(walletId);
    });

    walletTxs.forEach((tx) => {
      const cat = String(tx.kategori || '');
      const n = Number(tx.nominal) || 0;
      const isPiutang = cat.startsWith('Piutang');
      const isUtang = !isPiutang && cat.startsWith('Utang');
      if (isPiutang) {
        if (tx.tipe === 'Pengeluaran') totalOut += n;
        else totalIn += n;
      } else if (isUtang) {
        if (tx.tipe === 'Pengeluaran') totalOut += n;

  function createPinSalt() {
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function derivePinHash(pin, saltHex) {
    const enc = new TextEncoder();
    if (window.crypto && window.crypto.subtle && typeof window.crypto.subtle.deriveBits === 'function') {
      const keyMat = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: enc.encode(String(saltHex || '')), iterations: 100000, hash: 'SHA-256' },
        keyMat,
        256
      );
      return 'pbkdf2$' + Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    const buf = await crypto.subtle.digest('SHA-256', enc.encode(String(saltHex || '') + ':' + String(pin)));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function hashPin(pin) {
    const salt = createPinSalt();
    localStorage.setItem('mk_app_pin_salt', salt);
    return derivePinHash(pin, salt);
  }

  async function verifyPinMatches(pin, savedHash) {
    if (String(savedHash).startsWith('pbkdf2$')) {
      const salt = localStorage.getItem('mk_app_pin_salt') || '';
      return (await derivePinHash(pin, salt)) === savedHash;
    }
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mkpin:' + String(pin)));
    const legacyHex = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    if (legacyHex === savedHash) {
      const newHash = await hashPin(pin);
      localStorage.setItem('mk_app_pin_hash', newHash);
      return true;
    }
    return false;
  }

        if (box) box.classList.add('hide');
      };
    }

    if (typeof window.submitTransaction === 'function' && !window._origSubmitTransaction) {
      window._origSubmitTransaction = window.submitTransaction;
      window.submitTransaction = async function (e) {
        const rowId = (document.getElementById('tr_row') || {}).value;
        const tipe = (document.getElementById('tr_tipe') || {}).value;
        const splitChk = document.getElementById('tr_split_enable');
        if (!rowId && tipe === 'Pengeluaran' && splitChk && splitChk.checked) {
          e.preventDefault();
          let tanggal = (document.getElementById('tr_tanggal') || {}).value;
          if (!tanggal && typeof fpTanggal !== 'undefined' && fpTanggal && fpTanggal.selectedDates && fpTanggal.selectedDates.length) {
            const d = fpTanggal.selectedDates[0];
            tanggal = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          }
          const totalNominal = parseFloat((document.getElementById('tr_nominal') || {}).value);
          const friendShare = parseFloat((document.getElementById('tr_split_amount') || {}).value);
          const person = ((document.getElementById('tr_split_person') || {}).value || '').trim();
          const kategori = (document.getElementById('tr_kategori') || {}).value;
          const note = ((document.getElementById('tr_keterangan') || {}).value || '').trim();
          const walletId = (document.getElementById('tr_wallet') || {}).value || '';

          if (!tanggal || !/^\d{4}-\d{2}-\d{2}/.test(tanggal) || !totalNominal || totalNominal <= 0) {
            Swal.fire({ icon: 'error', title: 'Data tidak valid', text: 'Isi tanggal dan nominal total dengan benar.', customClass: { popup: getSwalClass() } });
            return;
          }
          if (!person || !friendShare || friendShare <= 0 || friendShare >= totalNominal) {
            Swal.fire({ icon: 'error', title: 'Split Bill tidak valid', text: 'Isi nama teman dan porsi teman lebih dari 0 serta lebih kecil dari total transaksi.', customClass: { popup: getSwalClass() } });
            return;
          }

          const myPortion = totalNominal - friendShare;
          const submitBtn = document.getElementById('btnSubmitTrans');
          if (submitBtn && submitBtn.disabled) return;
          if (submitBtn) submitBtn.disabled = true;
          try {
            if (!((DB.entities && DB.entities.Piutang) || []).includes(person)) {
              const entData = await callServer('api_addEntity', 'Piutang', person);
              if (entData && entData.entities) DB.entities = entData.entities;
            }
            const data1 = await callServer('api_addTransaction', {
              tanggal, tipe: 'Pengeluaran', kategori, nominal: myPortion,
              keterangan: (note ? note + ' ' : '') + '[Split Bill dengan ' + person + ']', walletId
            });
            const data2 = await callServer('api_addTransaction', {
              tanggal, tipe: 'Pengeluaran', kategori: 'Piutang - ' + person, nominal: friendShare,
              keterangan: 'Patungan: ' + (note || kategori), walletId
            });
            const addedTransactions = [data1 && data1.transaction, data2 && data2.transaction].filter(Boolean);
            const mergedPayload = { addedTransactions };
            const txMonth = cycleOfDate(tanggal);
            if (txMonth !== DB.currentPeriod) {
              await callServer('api_savePeriod', txMonth);
              mergedPayload.currentPeriod = txMonth;
              if (typeof fpMonth !== 'undefined' && fpMonth) {
                try { fpMonth.setDate(txMonth, false); } catch (_) {}
              }
            }
            await refreshFromServer(mergedPayload);
            Swal.fire({
              icon: 'success',
              title: 'Split Bill Tercatat!',
              html: `Porsi Anda <b>${formatRupiah(myPortion)}</b> + Piutang <b>${escapeHtmlJS(person)}</b> sebesar <b>${formatRupiah(friendShare)}</b> tersimpan.`,

              customClass: { popup: getSwalClass() }

            if (typeof showActionError === 'function') showActionError(err);

  window.handleRestoreJsonFile = async function (event) {
    const file = event && event.target && event.target.files && event.target.files[0];
    if (!file) return;
    if (typeof FinanceAnalysis === 'undefined' || typeof FinanceAnalysis.prepareBackupRestorePayload !== 'function') {
      Swal.fire({ icon: 'error', title: 'Error', text: 'Modul analisis belum siap.', customClass: { popup: getSwalClass() } });
      return;
    }

    let parsed;
    try {
      const text = await file.text();
      parsed = JSON.parse(text);
    } catch (_) {
      Swal.fire({ icon: 'error', title: 'File Tidak Valid', text: 'File bukan JSON backup yang valid.', customClass: { popup: getSwalClass() } });
      return;
    }

    const plan = FinanceAnalysis.prepareBackupRestorePayload(parsed, DB);
    if (!plan.valid) {
      Swal.fire({ icon: 'error', title: 'Format Tidak Dikenali', text: 'File JSON tidak memuat array transactions, budgets, atau goals.', customClass: { popup: getSwalClass() } });
      return;
    }

    const totalNew = plan.newTransactions.length + plan.newBudgets.length + plan.newGoals.length;
    if (totalNew === 0) {
      Swal.fire({
        icon: 'info',
        title: 'Semua Data Sudah Tersimpan',
        text: `Tidak ada data baru untuk ditambahkan (${plan.skippedTransactions} transaksi, ${plan.skippedBudgets} budget, ${plan.skippedGoals} target sudah ada).`,
        customClass: { popup: getSwalClass() }
      });
      return;
    }

    const confirmRes = await Swal.fire({
      icon: 'question',
      title: 'Konfirmasi Restore & Merge JSON',
      html: `
        <div class="text-left text-xs space-y-2 text-slate-600 dark:text-slate-300">
          <p>Data baru akan ditambahkan tanpa menduplikasi data yang sudah ada:</p>
          <ul class="list-disc pl-5 space-y-1">
            <li><strong>Transaksi baru:</strong> ${plan.newTransactions.length} <span class="text-slate-400">(${plan.skippedTransactions} dilewati)</span></li>
            <li><strong>Budget baru:</strong> ${plan.newBudgets.length} <span class="text-slate-400">(${plan.skippedBudgets} dilewati)</span></li>
            <li><strong>Target keuangan baru:</strong> ${plan.newGoals.length} <span class="text-slate-400">(${plan.skippedGoals} dilewati)</span></li>
          </ul>
        </div>`,
      showCancelButton: true,
      confirmButtonText: 'Pulihkan Sekarang',
      cancelButtonText: t('btn.batal'),
      customClass: { popup: getSwalClass() }
    });
    if (!confirmRes.isConfirmed) return;

    Swal.fire({
      title: 'Memulihkan data...',
      text: 'Mohon tunggu sebentar.',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading(),
      customClass: { popup: getSwalClass() }
    });

    try {
      const validWalletIds = new Set((DB.wallets || []).map((w) => String(w.id)));
      const fallbackWalletId = (DB.wallets && DB.wallets[0] && DB.wallets[0].id) || '';
      for (let i = 0; i < plan.newTransactions.length; i += 500) {
        const chunk = plan.newTransactions.slice(i, i + 500).map((tx) => ({
          ...tx,
          walletId: tx.walletId && validWalletIds.has(String(tx.walletId)) ? tx.walletId : fallbackWalletId
        }));
        const txRes = await callServer('api_importTransactions', chunk);
        await refreshFromServer(txRes);
      }
      for (const b of plan.newBudgets) {
        const bRes = await callServer('api_saveBudget', b.kategori, b.bulan, b.jumlah);
        await refreshFromServer(bRes);
      }
      for (const g of plan.newGoals) {
        const gRes = await callServer('api_saveGoal', g);
        await refreshFromServer(gRes);
      }
      Swal.fire({
        icon: 'success',
        title: 'Restore Selesai!',
        text: `${plan.newTransactions.length} transaksi, ${plan.newBudgets.length} budget, dan ${plan.newGoals.length} target berhasil dipulihkan.`,
        customClass: { popup: getSwalClass() }
      });
    } catch (err) {
      if (typeof showActionError === 'function') showActionError(err);
      else Swal.fire({ icon: 'error', title: 'Gagal Restore', text: String(err.message || err), customClass: { popup: getSwalClass() } });
    }
  };

    if (typeof isDataReady === 'undefined' || !isDataReady || typeof FinanceAnalysis === 'undefined' || typeof FinanceAnalysis.getDueRecurringBills !== 'function') {
      banner.classList.add('hide');
      banner.innerHTML = '';
      return;
    }

    const todayStr = typeof localToday === 'function' ? localToday() : new Date().toISOString().slice(0, 10);
    const due = FinanceAnalysis.getDueRecurringBills(
      DB.recurring || [],
      DB.transactions || [],
      todayStr,
      DB.currentPeriod,
      DB.payrollDay
    );

    if (!due || due.count === 0) {
      banner.classList.add('hide');
      banner.innerHTML = '';
      return;
    }

    banner.classList.remove('hide');
    const previewChips = due.dueBills.slice(0, 3).map((b) => {
      const isInc = b.tipe === 'Pemasukan';
      const color = isInc ? 'text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-500/20' : 'text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-500/20';
      return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-bold ${color}">${escapeHtmlJS(b.kategori)}: ${isInc ? '+' : '-'}${formatRupiah(b.nominal).replace(',00', '')}</span>`;
    }).join('');
    const moreText = due.dueBills.length > 3 ? `<span class="text-xs text-amber-700 dark:text-amber-300 font-semibold">+${due.dueBills.length - 3} lainnya</span>` : '';

    banner.innerHTML = `
      <div class="rounded-3xl border border-amber-200 dark:border-amber-500/30 bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-950/40 dark:to-orange-950/30 p-4 sm:p-5 shadow-sm">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-2xl bg-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0">
              <i class="ph-bold ph-calendar-check text-xl" aria-hidden="true"></i>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h4 class="text-sm font-extrabold text-slate-800 dark:text-white">${due.count} <span data-i18n="dash.recurring_due">${escapeHtmlJS(t('dash.recurring_due'))}</span></h4>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-200 dark:bg-amber-500/30 text-amber-800 dark:text-amber-300">Siap Catat</span>
              </div>
              <p class="text-xs text-slate-600 dark:text-slate-300 mt-1">Total tagihan: <strong>${formatRupiah(due.totalDueAmount).replace(',00', '')}</strong> pada siklus ini dan belum tercatat.</p>
              <div class="flex flex-wrap items-center gap-1.5 mt-2.5">
                ${previewChips}
                ${moreText}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0 self-end sm:self-center">
            <button type="button" onclick="batchRecordRecurring()" class="px-4 py-2.5 rounded-2xl bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-extrabold text-xs flex items-center gap-2 shadow-md shadow-amber-500/20 transition-all">
              <i class="ph-bold ph-lightning" aria-hidden="true"></i>
              <span data-i18n="dash.batch_record">Catat Semua Sekaligus</span>
            </button>
          </div>
        </div>
      </div>`;
  };

  window.batchRecordRecurring = async function () {
    if (typeof isDataReady === 'undefined' || !isDataReady || typeof FinanceAnalysis === 'undefined') return;
    const todayStr = typeof localToday === 'function' ? localToday() : new Date().toISOString().slice(0, 10);
    const due = FinanceAnalysis.getDueRecurringBills(
      DB.recurring || [],
      DB.transactions || [],
      todayStr,
      DB.currentPeriod,
      DB.payrollDay
    );

    if (!due || due.count === 0) {
      Swal.fire({
        icon: 'info',
        title: 'Semua Sudah Dicatat',
        text: 'Tidak ada tagihan rutin yang jatuh tempo untuk dicatat.',
        customClass: { popup: getSwalClass() }
      });
      return;
    }

    const itemsHtml = due.dueBills.map((b) => {
      const isInc = b.tipe === 'Pemasukan';
      return `
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 text-xs">
          <span class="font-bold text-slate-800 dark:text-white truncate">${escapeHtmlJS(b.kategori)}${b.keterangan ? ' · ' + escapeHtmlJS(b.keterangan) : ''}</span>
          <span class="font-black ${isInc ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'} shrink-0">${isInc ? '+' : '-'}${formatRupiah(b.nominal).replace(',00', '')}</span>
        </div>`;
    }).join('');

    const walletSelectHtml = (typeof walletOptions === 'function' && (DB.wallets || []).length)
      ? `<div class="mt-3 text-left"><label for="batch-rec-wallet" class="block text-xs font-bold text-slate-500 mb-1">Dompet pencatatan</label><select id="batch-rec-wallet" class="swal2-input" style="margin:0;width:100%">${walletOptions('')}</select></div>`
      : '';

    const res = await Swal.fire({
      title: 'Catat Semua Tagihan Jatuh Tempo?',
      html: `
        <p class="text-xs text-slate-600 dark:text-slate-300 mb-3 text-left">
          Terdapat <strong>${due.count} tagihan</strong> dengan total <strong>${formatRupiah(due.totalDueAmount).replace(',00', '')}</strong> yang akan langsung dicatat sebagai transaksi hari ini (${todayStr}).
        </p>
        <div class="space-y-1.5 max-h-52 overflow-y-auto text-left mb-2">${itemsHtml}</div>
        ${walletSelectHtml}`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: '⚡ Ya, Catat Semua',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#f59e0b',
      customClass: { popup: getSwalClass() },
      preConfirm: () => ({
        walletId: (document.getElementById('batch-rec-wallet') || {}).value || (DB.wallets && DB.wallets[0] && DB.wallets[0].id) || ''
      })
    });
    if (!res.isConfirmed) return;

    Swal.fire({
      title: 'Mencatat Jadwal Rutin...',
      text: 'Menyimpan transaksi ke database',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading(),
      customClass: { popup: getSwalClass() }
    });

    try {
      const targetWalletId = (res.value && res.value.walletId) || (DB.wallets && DB.wallets[0] && DB.wallets[0].id) || '';
      const addedTransactions = [];
      const recordedIds = [];
      let latestPeriod = '';
      for (const bill of due.dueBills) {
        const payload = {
          tanggal: todayStr,
          tipe: bill.tipe,
          kategori: bill.kategori,
          nominal: Number(bill.nominal) || 0,
          keterangan: (bill.keterangan ? bill.keterangan + ' ' : '') + '(rutin)',
          walletId: targetWalletId
        };
        const txRes = await callServer('api_addTransaction', payload);
        if (txRes && txRes.transaction) addedTransactions.push(txRes.transaction);
        if (txRes && txRes.currentPeriod && (!latestPeriod || txRes.currentPeriod > latestPeriod)) {
          latestPeriod = txRes.currentPeriod;
        }
        if (bill.id) recordedIds.push(bill.id);
      }

      let recRes = null;
      if (recordedIds.length) {
        try {
          recRes = await callServer('api_markRecurringRun', recordedIds, todayStr);
        } catch (_) {}
      }

      await refreshFromServer({
        addedTransactions,
        ...(latestPeriod ? { currentPeriod: latestPeriod } : {}),
        ...(recRes && recRes.recurring ? { recurring: recRes.recurring } : {})
      });

      Swal.fire({
        icon: 'success',
        title: 'Berhasil Dicatat!',
        text: `${due.count} tagihan rutin berhasil dicatat ke siklus ini.`,
        timer: 1500,
        showConfirmButton: false,
        customClass: { popup: getSwalClass() }
      });
    } catch (err) {
      if (typeof showActionError === 'function') showActionError(err);
      else Swal.fire({ icon: 'error', title: 'Gagal', text: String(err.message || err), customClass: { popup: getSwalClass() } });
    }
  };

  window.renderNetWorthChart = function () {
    const canvas = document.getElementById('netWorthChart');
    if (!canvas || typeof isDataReady === 'undefined' || !isDataReady || typeof Chart === 'undefined') return;
    if (typeof FinanceAnalysis === 'undefined' || typeof FinanceAnalysis.computeNetWorthSeries !== 'function') return;

    const series = FinanceAnalysis.computeNetWorthSeries(DB, DB.currentPeriod, DB.payrollDay, 6);
    if (!series || !series.length) return;

    if (window._netWorthChartInstance) {
      window._netWorthChartInstance.destroy();
      window._netWorthChartInstance = null;
    }

    const labels = series.map((s) => s.period);
    const dataPoints = series.map((s) => s.estimatedNetWorth);

    const isDark = document.documentElement.classList.contains('dark');
    const gridColor = isDark ? 'rgba(148,163,184,0.12)' : 'rgba(148,163,184,0.18)';
    const textColor = isDark ? '#94a3b8' : '#64748b';
    const brandColor = '#10b981';
    const ctx = canvas.getContext('2d');

    window._netWorthChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Kekayaan Bersih (Net Worth)',
          data: dataPoints,
          borderColor: brandColor,
          backgroundColor: 'rgba(16, 185, 129, 0.12)',
          borderWidth: 2.5,
          tension: 0.35,
          fill: true,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: brandColor,
          pointBorderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: isDark ? '#0f172a' : '#ffffff',
            titleColor: isDark ? '#ffffff' : '#0f172a',
            bodyColor: isDark ? '#cbd5e1' : '#334155',
            borderColor: isDark ? '#334155' : '#e2e8f0',
            borderWidth: 1,
            padding: 10,
            boxPadding: 4,
            callbacks: {
              label: (ctx) => ' ' + formatRupiah(ctx.parsed.y).replace(',00', '')
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: textColor, font: { size: 11, weight: '600' } }
          },
          y: {
            grid: { color: gridColor },
            ticks: {
              color: textColor,
              font: { size: 10 },
              callback: (val) => (typeof formatShortIDR === 'function' ? formatShortIDR(val) : val)
            }
          }
        }
      }
    });
  };

  window.openFinancialStatementModal = function () {
    if (typeof isDataReady === 'undefined' || !isDataReady || typeof FinanceAnalysis === 'undefined' || typeof FinanceAnalysis.compileOnePageFinancialStatement !== 'function') {
      Swal.fire({ icon: 'error', title: 'Error', text: 'Modul analisis keuangan belum siap.', customClass: { popup: getSwalClass() } });
      return;
    }

    const st = FinanceAnalysis.compileOnePageFinancialStatement(DB, DB.currentPeriod, DB.payrollDay);
    const dateRangeLabel = `${st.range.start} s/d ${st.range.end}`;
    const runwayText = st.ratios.emergencyRunwayMonths !== null ? `${st.ratios.emergencyRunwayMonths} Bulan` : '—';

    const buildStatementHtml = (fmtFn, forPrint) => {
      const cardStyle = forPrint
        ? 'padding:12px;border-radius:12px;border:1px solid #cbd5e1;background:#f8fafc;'
        : '';
      const cardClass = forPrint ? '' : 'p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800';
      const innerCardStyle = forPrint
        ? 'padding:8px;border-radius:8px;border:1px solid #e2e8f0;background:#ffffff;'
        : '';
      const innerCardClass = forPrint ? '' : 'p-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800';
      const rowBorder = forPrint ? 'border-bottom:1px solid #e2e8f0;padding:5px 0;font-size:12px;display:flex;justify-content:space-between;' : '';
      const rowClass = forPrint ? '' : 'flex items-center justify-between py-1 border-b border-slate-100 dark:border-slate-800 text-xs';

      const topExpHtml = (st.topExpenses || []).map((e, idx) => {
        const catName = e.category || 'Lainnya';
        const catAmt = e.amount ?? 0;
        return `
          <div class="${rowClass}" ${forPrint ? `style="${rowBorder}"` : ''}>
            <span class="${forPrint ? '' : 'text-slate-600 dark:text-slate-300'}">${idx + 1}. ${escapeHtmlJS(catName)}</span>
            <span class="${forPrint ? '' : 'font-extrabold text-slate-800 dark:text-white'}" style="${forPrint ? 'font-weight:800;' : ''}">${fmtFn(catAmt)} (${e.sharePct}%)</span>
          </div>`;
      }).join('') || '<p style="font-size:12px;color:#64748b;padding:4px 0;">Belum ada pengeluaran.</p>';

      return `
        <div class="text-left space-y-4">
          <div style="${forPrint ? 'border-bottom:2px solid #0f172a;padding-bottom:10px;margin-bottom:12px;' : ''}" class="${forPrint ? '' : 'border-b border-slate-200 dark:border-slate-700 pb-3'}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <h3 style="${forPrint ? 'margin:0;font-size:16px;font-weight:900;text-transform:uppercase;color:#0f172a;' : ''}" class="${forPrint ? '' : 'text-base font-black text-slate-900 dark:text-white uppercase tracking-wide'}">Ringkasan Finansial Eksekutif</h3>
              <span style="${forPrint ? 'font-size:10px;font-weight:700;padding:3px 8px;border:1px solid #4f46e5;border-radius:999px;color:#4f46e5;text-transform:uppercase;' : ''}" class="${forPrint ? '' : 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-brand/10 text-brand dark:text-brand-ink uppercase'}">1-Page Statement</span>
            </div>
            <p style="${forPrint ? 'margin:4px 0 0;font-size:12px;color:#475569;' : ''}" class="${forPrint ? '' : 'text-xs text-slate-500 dark:text-slate-400 mt-0.5'}">Pengguna: <strong>${escapeHtmlJS(sessionUser || 'User')}</strong> · Siklus: <strong>${escapeHtmlJS(st.period)}</strong> (${escapeHtmlJS(dateRangeLabel)})</p>
          </div>

          <div style="${forPrint ? 'display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;' : ''}" class="${forPrint ? '' : 'grid grid-cols-1 sm:grid-cols-2 gap-3'}">
            <div class="${cardClass}" style="${cardStyle}">
              <span style="${forPrint ? 'font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;' : ''}" class="${forPrint ? '' : 'text-[10px] font-bold uppercase tracking-wider text-slate-400'}">Kekayaan Bersih (Net Worth)</span>
              <p style="${forPrint ? 'margin:4px 0 8px;font-size:18px;font-weight:900;color:#0f172a;' : ''}" class="${forPrint ? '' : 'text-lg font-black text-slate-900 dark:text-white mt-0.5'}">${fmtFn(st.netWorth)}</p>
              <div style="${forPrint ? 'font-size:11px;color:#334155;' : ''}" class="${forPrint ? '' : 'text-[11px] text-slate-500 dark:text-slate-400 mt-1 space-y-0.5'}">
                <div style="display:flex;justify-content:space-between;"><span>Kas Dompet:</span> <strong>${fmtFn(st.walletsTotal)}</strong></div>
                <div style="display:flex;justify-content:space-between;"><span>Investasi/Aset:</span> <strong>${fmtFn(st.assetsTotal)}</strong></div>
                <div style="display:flex;justify-content:space-between;"><span>Piutang:</span> <strong>${fmtFn(st.piutangTotal)}</strong></div>
                <div style="display:flex;justify-content:space-between;"><span>Utang:</span> <strong style="color:#e11d48;">-${fmtFn(st.utangTotal)}</strong></div>
              </div>
            </div>

            <div class="${cardClass}" style="${cardStyle}">
              <span style="${forPrint ? 'font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;' : ''}" class="${forPrint ? '' : 'text-[10px] font-bold uppercase tracking-wider text-slate-400'}">Arus Kas Siklus Berjalan</span>
              <p style="${forPrint ? `margin:4px 0 8px;font-size:18px;font-weight:900;color:${st.netCashflow >= 0 ? '#059669' : '#e11d48'};` : ''}" class="${forPrint ? '' : `text-lg font-black ${st.netCashflow >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'} mt-0.5`}">${st.netCashflow >= 0 ? '+' : ''}${fmtFn(st.netCashflow)}</p>
              <div style="${forPrint ? 'font-size:11px;color:#334155;' : ''}" class="${forPrint ? '' : 'text-[11px] text-slate-500 dark:text-slate-400 mt-1 space-y-0.5'}">
                <div style="display:flex;justify-content:space-between;"><span>Pemasukan:</span> <strong style="color:#059669;">${fmtFn(st.incomeTotal)}</strong></div>
                <div style="display:flex;justify-content:space-between;"><span>Pengeluaran:</span> <strong style="color:#e11d48;">${fmtFn(st.expenseTotal)}</strong></div>
                <div style="display:flex;justify-content:space-between;"><span>Savings Rate:</span> <strong>${st.savingsRate}%</strong></div>
                <div style="display:flex;justify-content:space-between;"><span>Biaya Rutin (Fixed):</span> <strong>${st.fixedCostRatioPct}%</strong></div>
              </div>
            </div>
          </div>

          <div class="${cardClass}" style="${forPrint ? cardStyle + 'margin-bottom:12px;' : ''}">
            <span style="${forPrint ? 'display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:6px;' : ''}" class="${forPrint ? '' : 'text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 block'}">Metrik Kesehatan Finansial</span>
            <div style="${forPrint ? 'display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;' : ''}" class="${forPrint ? '' : 'grid grid-cols-2 gap-2 text-xs'}">
              <div class="${innerCardClass}" style="${innerCardStyle}">
                <span style="${forPrint ? 'font-size:10px;color:#64748b;' : ''}" class="${forPrint ? '' : 'text-[10px] text-slate-400'}">Runway Dana Darurat</span>
                <p style="${forPrint ? 'margin:2px 0;font-weight:900;color:#0f172a;' : ''}" class="${forPrint ? '' : 'font-black text-slate-800 dark:text-white mt-0.5'}">${escapeHtmlJS(runwayText)}</p>
                <span style="${forPrint ? 'font-size:10px;font-weight:700;color:#4f46e5;' : ''}" class="${forPrint ? '' : 'text-[10px] font-bold text-brand'}">${escapeHtmlJS(st.ratios.runwayStatus)}</span>
              </div>
              <div class="${innerCardClass}" style="${innerCardStyle}">
                <span style="${forPrint ? 'font-size:10px;color:#64748b;' : ''}" class="${forPrint ? '' : 'text-[10px] text-slate-400'}">Rasio Utang / Aset</span>
                <p style="${forPrint ? 'margin:2px 0;font-weight:900;color:#0f172a;' : ''}" class="${forPrint ? '' : 'font-black text-slate-800 dark:text-white mt-0.5'}">${st.ratios.debtToAssetPct}%</p>
                <span style="${forPrint ? `font-size:10px;font-weight:700;color:${st.ratios.debtToAssetPct <= 30 ? '#059669' : '#d97706'};` : ''}" class="${forPrint ? '' : `text-[10px] font-bold ${st.ratios.debtToAssetPct <= 30 ? 'text-emerald-600' : 'text-amber-600'}`}">${escapeHtmlJS(st.ratios.debtStatus)}</span>
              </div>
            </div>
          </div>

          <div class="${cardClass}" style="${cardStyle}">
            <span style="${forPrint ? 'display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:6px;' : ''}" class="${forPrint ? '' : 'text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 block'}">Pengeluaran Terbesar Periode Ini</span>
            <div class="space-y-0.5">${topExpHtml}</div>
          </div>
        </div>`;
    };

    const fmtPreview = (n) => formatRupiah(n).replace(',00', '');
    Swal.fire({
      html: `<div id="printStatementArea">${buildStatementHtml(fmtPreview, false)}</div>`,
      width: '540px',
      showCancelButton: true,
      confirmButtonText: '🖨️ Cetak / Print',
      cancelButtonText: 'Tutup',
      confirmButtonColor: '#4f46e5',
      customClass: { popup: getSwalClass() }
    }).then((result) => {
      if (!result.isConfirmed) return;
      const fmtPrint = (n) => (typeof _origFormatRupiah === 'function' ? _origFormatRupiah(n) : formatRupiah(n)).replace(',00', '');
      let root = document.getElementById('mkPrintStatementRoot');
      if (!root) {
        root = document.createElement('div');
        root.id = 'mkPrintStatementRoot';
        document.body.appendChild(root);
      }
      root.innerHTML = `<div style="font-family:Inter,system-ui,sans-serif;padding:8px;color:#0f172a;background:#fff;">${buildStatementHtml(fmtPrint, true)}</div>`;
      document.body.classList.add('mk-printing-statement');
      const cleanup = () => {
        document.body.classList.remove('mk-printing-statement');
        root.innerHTML = '';
        window.removeEventListener('afterprint', cleanup);
      };
      window.addEventListener('afterprint', cleanup);
      setTimeout(() => { window.print(); }, 60);
      setTimeout(cleanup, 15000);
    });
  };

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window._deferredPwaPrompt = e;
    document.getElementById('pwaInstallWrap')?.classList.remove('hidden');
  });

  window.addEventListener('appinstalled', () => {
    window._deferredPwaPrompt = null;
    document.getElementById('pwaInstallWrap')?.classList.add('hidden');
  });

  installHooks();
  document.addEventListener('DOMContentLoaded', () => {
    installHooks();
    window.refreshUpdatesBadge();
    setTimeout(() => { window.filterUpdatesList(); }, 120);
    const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
    if (!isStandalone && (window._deferredPwaPrompt || isIos)) {
      document.getElementById('pwaInstallWrap')?.classList.remove('hidden');
    }
    if (navigator.onLine) {
      setTimeout(() => { window.flushOfflineQueue(true); }, 1500);
    }
  });
  window.addEventListener('online', () => {
    window.flushOfflineQueue(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (typeof Swal !== 'undefined' && Swal.isVisible()) return;
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;
    if (typeof isDataReady === 'undefined' || !isDataReady) return;
    const k = String(e.key || '').toLowerCase();
    if (k === 'n') {
      e.preventDefault();
      openForm('Pengeluaran');
    } else if (k === 'h') {
      e.preventDefault();
      if (typeof toggleHideNominal === 'function') toggleHideNominal();
    } else if (e.key === '/') {
      e.preventDefault();
      switchView('laporan');
      setTimeout(() => { const s = document.getElementById('lapSearch'); if (s) s.focus(); }, 80);
    }
  });
})();
</script>
