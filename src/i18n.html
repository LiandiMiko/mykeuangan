/* ============================================================
   LANGUAGE STATE & HELPERS
   ============================================================ */
let currentLang = localStorage.getItem('lang') || 'id';

function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) || key;
}

function setLang(lang) {
  if (lang !== 'id' && lang !== 'en') return;
  currentLang = lang;
  localStorage.setItem('lang', lang);
  applyTranslations();
  if (typeof renderAll === 'function' && isDataReady) {
    renderAll();
  }
  updateLangUI();
}

function updateLangUI() {
  // Update active state di tombol lang
  document.querySelectorAll('[data-lang-btn]').forEach(btn => {
    const isActive = btn.getAttribute('data-lang-btn') === currentLang;
    btn.classList.toggle('bg-brand', isActive);
    btn.classList.toggle('text-white', isActive);
    btn.classList.toggle('text-slate-500', !isActive);
  });
}

function applyTranslations() {
  // Text content
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val) el.textContent = val;
  });

  // Placeholder
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    const val = t(key);
    if (val) el.placeholder = val;
  });

  // Title attribute
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.getAttribute('data-i18n-title');
    const val = t(key);
    if (val) el.title = val;
  });
}

/* ============================================================
   INIT — Auto-apply saat halaman load
   ============================================================ */
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    console.log('[i18n] Init, lang=' + currentLang);
    applyTranslations();
    updateLangUI();
  }, 100);
});

/* ============================================================
   LOCALIZED MONTH HELPERS
   ============================================================ */
function getMonthName(monthIndex) {
  // monthIndex: 0-11
  const keys = ['month.jan','month.feb','month.mar','month.apr','month.mei','month.jun',
                'month.jul','month.aug','month.sep','month.oct','month.nov','month.des'];
  return t(keys[monthIndex]);
}

function getMonthShort(monthIndex) {
  // monthIndex: 0-11
  const full = getMonthName(monthIndex);
  return full.length > 3 ? full.substring(0, 3) : full;
}
