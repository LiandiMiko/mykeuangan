<!-- ================= HISTORI TRANSAKSI SIKLUS ================= -->
<section id="view-histori" class="view-section hide fade-in" aria-labelledby="historiTitle">
  <div class="mb-4 sm:mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 sm:gap-4">
    <div class="flex items-center sm:items-start gap-2.5 sm:gap-3">
      <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl sm:rounded-2xl bg-brand/10 text-brand dark:text-brand-ink flex items-center justify-center shrink-0">
        <i class="ph ph-list-bullets text-lg sm:text-2xl" aria-hidden="true"></i>
      </div>
      <div>
        <div class="flex flex-wrap items-center gap-2">
          <h2 id="historiTitle" class="text-lg sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight" data-i18n="histori.title">Histori Transaksi Siklus</h2>
          <span class="px-2.5 py-0.5 rounded-full bg-brand/10 text-brand dark:text-brand-ink text-[11px] sm:text-xs font-bold chartMonthLabel"></span>
        </div>
        <p class="hidden sm:block text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1" data-i18n="histori.subtitle">Daftar seluruh pemasukan dan pengeluaran pada periode siklus gajian yang dipilih.</p>
      </div>
    </div>
    <div class="grid grid-cols-2 w-full sm:w-auto sm:flex gap-2">
      <button type="button" data-action="openForm" data-args='["Pemasukan"]' class="min-h-11 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm transition-colors">
        <i class="ph ph-plus-circle text-base" aria-hidden="true"></i> <span data-i18n="dash.btn_pemasukan">Pemasukan</span>
      </button>
      <button type="button" data-action="openForm" data-args='["Pengeluaran"]' class="min-h-11 px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm transition-colors">
        <i class="ph ph-minus-circle text-base" aria-hidden="true"></i> <span data-i18n="dash.btn_pengeluaran">Pengeluaran</span>
      </button>
    </div>
  </div>

  <!-- FILTER CEPAT SIKLUS -->
  <div class="mb-4 sm:mb-5 flex flex-col sm:flex-row gap-2.5 sm:gap-3">
    <div class="relative flex-1">
      <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true"></i>
      <input type="search" id="historiSearch" enterkeyhint="search" data-action="filterHistoriView" data-action-on="input" maxlength="100" data-i18n-placeholder="histori.search_placeholder" placeholder="Cari kategori atau catatan di siklus ini..."
             class="w-full min-h-12 pl-10 pr-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-brand text-xs sm:text-sm text-slate-800 dark:text-white mk-card-surface">
    </div>
    <select id="historiWalletFilter" data-action="filterHistoriView" data-action-on="change" aria-label="Filter dompet histori" class="sm:w-56 min-h-12 px-3.5 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-brand text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mk-card-surface">
      <option value="" data-i18n="lap.all_wallets">Semua dompet</option>
    </select>
    <button type="button" id="historiResetFilterBtn" data-action="resetHistoriFilters" class="hide min-h-11 px-3.5 py-2 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center gap-1.5 shrink-0 transition-colors">
      <i class="ph ph-x-circle text-base" aria-hidden="true"></i>
      <span data-i18n="filter.reset">Reset Filter</span>
    </button>
  </div>
  <div id="historiTagBar" class="hide mb-4 sm:mb-5 flex flex-wrap items-center gap-1.5"></div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-6">
    <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl border border-slate-200/80 dark:border-slate-800 mk-card-surface overflow-hidden flex flex-col">
      <div class="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/70 dark:bg-slate-800/40">
        <h3 class="font-bold text-sm sm:text-base text-emerald-700 dark:text-emerald-400 flex items-center gap-2">
          <i class="ph ph-arrow-down-left text-xl" aria-hidden="true"></i> <span data-i18n="dash.pemasukan">Pemasukan</span>
        </h3>
      </div>
      <div class="p-3.5 sm:p-5 max-h-[540px] overflow-y-auto space-y-2" id="listViewIn"></div>
    </div>
    <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl border border-slate-200/80 dark:border-slate-800 mk-card-surface overflow-hidden flex flex-col">
      <div class="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/70 dark:bg-slate-800/40">
        <h3 class="font-bold text-sm sm:text-base text-rose-600 dark:text-rose-400 flex items-center gap-2">
          <i class="ph ph-arrow-up-right text-xl" aria-hidden="true"></i> <span data-i18n="dash.pengeluaran">Pengeluaran</span>
        </h3>
      </div>
      <div class="p-3.5 sm:p-5 max-h-[540px] overflow-y-auto space-y-2" id="listViewOut"></div>
    </div>
  </div>
</section>
