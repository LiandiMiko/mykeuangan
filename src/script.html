<script>
/* ============================================================
   STATE
   ============================================================ */
const DB = {
  transactions: [],
  categories: { pemasukan: [], pengeluaran: [] },
  entities: { UtangApp: [], UtangPerson: [], Piutang: [] },
  assets: [],
  budgets: [],
  snapshots: [],
  wallets: [],
  transfers: [],
  goals: [],
  recurring: [],
  currentPeriod: new Date().toISOString().slice(0, 7),
  payrollDay: 28
};

let sessionUser = 'User';
let sessionRole = 'User';
let fpTanggal = null;
let fpMonth = null;
let isDataReady = false;
let laporanState = {
  page: 0,
  pageSize: 20,
  total: 0,
  period: '',
  requestId: 0,
  dirty: true,
  rows: []
};

let hideNominal = localStorage.getItem('hideNominal') === '1';

/* Helper sanitasi HTML & Attribute JS */
function escapeHtmlJS(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function escapeAttrJS(s) {
  if (s == null) return '';
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

const _origFormatRupiah = (a) => new Intl.NumberFormat('id-ID', {
  style: 'currency', currency: 'IDR', minimumFractionDigits: 0
}).format(a || 0);

const formatRupiah = (a) => {
  if (hideNominal) return 'Rp ••••••';
  return _origFormatRupiah(a);
};

function toggleHideNominal() {
  hideNominal = !hideNominal;
  localStorage.setItem('hideNominal', hideNominal ? '1' : '0');
  updateEyeIcon();
  if (typeof renderAll === 'function' && isDataReady) renderAll();
}

function updateEyeIcon() {
  const icon = document.getElementById('eyeIcon');
  if (icon) {
    icon.className = hideNominal ? 'ph ph-eye-slash' : 'ph ph-eye';
  }
  const btn = document.getElementById('toggleHideBtn');
  if (btn) {
    btn.title = hideNominal ? t('header.show_nominal') : t('header.hide_nominal');
    btn.setAttribute('aria-label', btn.title);
    btn.setAttribute('aria-pressed', String(hideNominal));
  }
}

const getSwalClass = () => document.documentElement.classList.contains('dark') ? 'dark-swal' : '';

function showActionError(error) {
  console.error(error);
  Swal.fire({
    icon: 'error',
    title: t('alert.failed'),
    text: String(error && error.message || error),
    customClass: { popup: getSwalClass() }
  });
}

/* ============================================================
   PAYROLL CYCLE HELPERS
   ============================================================ */
/**
 * Get range tanggal untuk periode berdasarkan payroll day.
 * @param {string} periodStr - format 'yyyy-MM'
 * @param {number} payrollDay - tanggal gajian (1-28)
 * @returns {{start: string, end: string}}
 */
function getPeriodRange(periodStr, payrollDay) {
  return FinanceAnalysis.getPeriodRange(periodStr, payrollDay);
}

/**
 * Cek apakah tanggal masuk dalam periode.
 */
function isInPeriod(tanggal, periodStr) {
  return FinanceAnalysis.isInPeriod(tanggal, periodStr, DB.payrollDay);
}

async function saveCurrentPeriod(period) {
  const previousPeriod = DB.currentPeriod;
  DB.currentPeriod = period;
  renderAll();
  try {
    await callServer('api_savePeriod', period);
  } catch (error) {
    DB.currentPeriod = previousPeriod;
    if (fpMonth) fpMonth.setDate(previousPeriod, false);
    renderAll();
    showActionError(error);
  }
}

function shiftCurrentPeriod(offset) {
  const period = FinanceAnalysis.shiftPeriod(DB.currentPeriod, offset);
  if (fpMonth) fpMonth.setDate(period, false);
  saveCurrentPeriod(period);
}

/**
 * Format label siklus untuk ditampilkan.
 * Contoh: "28 Agu - 27 Sep 2026"
 */
function getPeriodLabel(periodStr, payrollDay) {
  const range = getPeriodRange(periodStr, payrollDay);
  const s = new Date(range.start + 'T00:00:00');
  const e = new Date(range.end + 'T00:00:00');
  return s.getDate() + ' ' + getMonthShort(s.getMonth()) + ' - ' +
         e.getDate() + ' ' + getMonthShort(e.getMonth()) + ' ' + e.getFullYear();
}

/* ============================================================
   SERVER BRIDGE
   ============================================================ */
function callServer(fn, ...args) {
  // Fungsi ini DIGANTI oleh web/supabase-api.js. Kalau yang terpanggil ini, berarti supabase-api.js
  // atau library supabase-js gagal dimuat (jaringan, ad-blocker, atau config.js belum benar).
  return Promise.reject(new Error(
    'Koneksi ke Supabase belum siap (supabase-api.js / supabase-js gagal dimuat). ' +
    'Muat ulang halaman (Ctrl+F5), cek koneksi/ad-blocker, lalu lihat F12 → Console.'
  ));
}

async function refreshFromServer(payload) {
  if (payload) {
    const has = (key) => Object.prototype.hasOwnProperty.call(payload, key);
    if (has('transactions') || payload.transaction || payload.addedTransactions ||
        payload.deletedTransactionId || payload.renamedTransactionCategory) {
      laporanState.dirty = true;
    }
    if (has('transactions')) DB.transactions = payload.transactions || [];
    if (payload.transaction) {
      const index = DB.transactions.findIndex((item) => item.id === payload.transaction.id);
      if (index === -1) DB.transactions.push(payload.transaction);
      else DB.transactions[index] = payload.transaction;
    }
    if (payload.addedTransactions) {
      payload.addedTransactions.forEach((transaction) => {
        const index = DB.transactions.findIndex((item) => item.id === transaction.id);
        if (index === -1) DB.transactions.push(transaction);
        else DB.transactions[index] = transaction;
      });
    }
    if (payload.deletedTransactionId) {
      DB.transactions = DB.transactions.filter((item) => item.id !== payload.deletedTransactionId);
    }
    if (payload.renamedTransactionCategory) {
      DB.transactions.forEach((item) => {
        if (item.kategori === payload.renamedTransactionCategory.from &&
            (!payload.renamedTransactionCategory.tipe || item.tipe === payload.renamedTransactionCategory.tipe)) {
          item.kategori = payload.renamedTransactionCategory.to;
        }
      });
    }
    if (has('categories')) DB.categories = payload.categories || { pemasukan: [], pengeluaran: [] };
    if (has('entities')) DB.entities = payload.entities || { UtangApp: [], UtangPerson: [], Piutang: [] };
    if (has('assets')) DB.assets = payload.assets || [];
    if (has('budgets')) DB.budgets = payload.budgets || [];
    if (has('snapshots')) DB.snapshots = payload.snapshots || [];
    if (payload.currentPeriod) DB.currentPeriod = payload.currentPeriod;
    if (payload.payrollDay) DB.payrollDay = payload.payrollDay;
    if (has('wallets')) DB.wallets = payload.wallets || [];
    if (has('transfers')) DB.transfers = payload.transfers || [];
    if (has('goals')) DB.goals = payload.goals || [];
    if (payload.goal) {
      const index = DB.goals.findIndex((item) => item.id === payload.goal.id);
      if (index === -1) DB.goals.push(payload.goal);
      else DB.goals[index] = payload.goal;
    }
    if (payload.deletedGoalId) DB.goals = DB.goals.filter((goal) => goal.id !== payload.deletedGoalId);
    if (has('recurring')) DB.recurring = payload.recurring || [];
  }
  renderAll();
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', async () => {
  if (localStorage.getItem('mode') === 'dark') {
    document.documentElement.classList.add('dark');
  }
  setTheme(localStorage.getItem('theme') || '');

  const uEl = document.getElementById('ui-username');
  const rEl = document.getElementById('ui-role');
  const dEl = document.getElementById('dashTitle');
  if (uEl) uEl.innerText = sessionUser;
  if (rEl) rEl.innerText = sessionRole;
  if (dEl) dEl.innerText = 'Dashboard Keuangan ' + sessionUser;

  try {
    const data = await callServer('getInitialData');
    DB.transactions = data.transactions || [];
    DB.categories = data.categories || { pemasukan: [], pengeluaran: [] };
    DB.entities = data.entities || { UtangApp: [], UtangPerson: [], Piutang: [] };
    DB.assets = data.assets || [];
    DB.budgets = data.budgets || [];
    DB.currentPeriod = data.currentPeriod || DB.currentPeriod;
    DB.payrollDay = data.payrollDay || 1;
    DB.snapshots = data.snapshots || [];
    DB.wallets = data.wallets || [];
    DB.transfers = data.transfers || [];
    DB.goals = data.goals || [];
    DB.recurring = data.recurring || [];
    if (uEl) uEl.innerText = sessionUser;
    if (rEl) rEl.innerText = sessionRole;
    if (dEl) dEl.innerText = 'Dashboard Keuangan ' + sessionUser;
    console.log('[INIT] loaded', DB.transactions.length, 'transactions,', DB.snapshots.length, 'snapshots, period:', DB.currentPeriod);
    
    // 🆕 Auto-refresh harga crypto (kalau ada)
    const hasCrypto = (DB.assets || []).some(a => String(a.type).toLowerCase() === 'crypto');
    if (hasCrypto) {
      console.log('[INIT] Auto-refresh crypto prices...');
      try {
        const updated = await callServer('api_refreshPrices');
        DB.assets = updated.assets || DB.assets;
        console.log('[INIT] ✅ Crypto prices updated');
      } catch (err) {
        console.warn('[INIT] ⚠️ Auto-refresh gagal:', err);
      }
    }
    
  } catch (e) {
    console.error('[INIT] error:', e);
    Swal.fire({
      icon: 'error', title: 'Gagal memuat data',
      text: String(e.message || e),
      customClass: { popup: getSwalClass() }
    });
  }

  isDataReady = true;

  if (document.getElementById('tr_tanggal')) {
    fpTanggal = flatpickr("#tr_tanggal", {
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "d F Y",
      locale: "id",
      disableMobile: true
    });
  }

  if (document.getElementById('dashMonthPicker')) {
    fpMonth = flatpickr("#dashMonthPicker", {
      plugins: [new monthSelectPlugin({ shorthand: true, dateFormat: "Y-m", altFormat: "F Y" })],
      altInput: true,
      locale: "id",
      disableMobile: true,
      defaultDate: DB.currentPeriod,
      onChange: async (d, s) => {
        if (s) await saveCurrentPeriod(s);
      }
    });
  }

  if (typeof Chart !== 'undefined') {
    Chart.defaults.font.family = "'Inter', sans-serif";
  }

  // 🆕 Init eye icon
  updateEyeIcon();
  updateAiKeyStatusUI();
  bindReportControls();

  const loader = document.getElementById('appLoader');
  if (loader) loader.classList.add('hide');

  switchView('dashboard');
  renderAll();
});

/* ============================================================
   THEME & UI
   ============================================================ */
function setTheme(t) {
  const theme = t || '';
  document.documentElement.className = '';
  if (localStorage.getItem('mode') === 'dark') {
    document.documentElement.classList.add('dark');
  }
  if (theme) document.documentElement.classList.add(theme);
  localStorage.setItem('theme', theme);

  document.querySelectorAll('[data-theme-btn]').forEach(btn => {
    const isActive = (btn.getAttribute('data-theme-btn') || '') === theme;
    btn.classList.toggle('active-theme', isActive);
  });

  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    const isDark = document.documentElement.classList.contains('dark');
    const brandHex = getComputedStyle(document.documentElement).getPropertyValue('--color-brand').trim() || '#4f46e5';
    metaTheme.setAttribute('content', isDark ? '#0f172a' : brandHex);
  }

  if (typeof isDataReady !== 'undefined' && isDataReady) {
    try { renderPortfolioChart(); } catch (_) {}
  }
}

function toggleDarkMode() {
  document.documentElement.classList.toggle('dark');
  const isDark = document.documentElement.classList.contains('dark');
  localStorage.setItem('mode', isDark ? 'dark' : 'light');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    const brandHex = getComputedStyle(document.documentElement).getPropertyValue('--color-brand').trim() || '#4f46e5';
    metaTheme.setAttribute('content', isDark ? '#0f172a' : brandHex);
  }
  renderAll();
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  if (!sb || !ov) return;
  if (window.innerWidth >= 1024) {
    sb.classList.toggle('lg:-ml-72');
    sb.classList.toggle('lg:translate-x-0');
  } else {
    if (sb.classList.contains('-translate-x-full')) {
      sb.classList.remove('-translate-x-full');
      ov.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
      ov.classList.add('opacity-100');
    } else {
      sb.classList.add('-translate-x-full');
      ov.classList.remove('opacity-100');
      ov.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => ov.classList.add('hidden'), 300);
    }
  }
}

function switchView(id) {
  document.querySelectorAll('.view-section').forEach(el => el.classList.add('hide'));
  const target = document.getElementById('view-' + id);
  if (target) target.classList.remove('hide');

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.remove('active-nav', 'bg-brand-light', 'text-brand', 'dark:bg-slate-800', 'dark:text-white');
    btn.classList.add('text-slate-500', 'dark:text-slate-400');
  });

  const nav = document.getElementById('nav-' + (id.includes('utang') ? 'dashboard' : id));
  if (nav) {
    nav.classList.remove('text-slate-500', 'dark:text-slate-400');
    nav.classList.add('active-nav');
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (id === 'aset') {
    setTimeout(() => {
      try { renderPortfolioChart(); } catch (e) { console.error('renderPortfolioChart err:', e); }
    }, 60);
  }
  if (id === 'admin') loadAdminData();

  if (window.innerWidth < 1024) {
    const sb = document.getElementById('sidebar');
    if (sb && !sb.classList.contains('-translate-x-full')) toggleSidebar();
  }
}

/* ============================================================
   RENDER ALL
   ============================================================ */
function renderAll() {
  if (!isDataReady) return;
  try { renderDashboard(); } catch (e) { console.error('renderDashboard err:', e); }
  try { renderWallets(); } catch (e) { console.error('renderWallets err:', e); }
  try { renderRecurring(); } catch (e) { console.error('renderRecurring err:', e); }
  try { renderLaporan(); } catch (e) { console.error('renderLaporan err:', e); }
  try { renderDebtLists(); } catch (e) { console.error('renderDebtLists err:', e); }
  try { renderKalender(); } catch (e) { console.error('renderKalender err:', e); }
  try { renderBudgeting(); } catch (e) { console.error('renderBudgeting err:', e); }
  try { renderPortfolioChart(); } catch (e) { console.error('renderPortfolioChart err:', e); }
  try { updateAiKeyStatusUI(); } catch (e) { console.error('updateAiKeyStatusUI err:', e); }
}
/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard() {
  const period = DB.currentPeriod;
  console.log('[renderDashboard] period=' + period + ', payrollDay=' + DB.payrollDay);

    // ========================================================
  // SALDO KAS & NET WORTH (fix: pembayaran utang = kas keluar)
  // ========================================================
  let saldoKas = 0;
  let utangTotal = 0;
  let piutangTotal = 0;
  let totalIncome = 0;
  let totalExpense = 0;

  DB.transactions.forEach(t => {
    const isPiutang = String(t.kategori).startsWith('Piutang');
    const isUtang = !isPiutang && String(t.kategori).startsWith('Utang');

    if (isUtang) {
      if (t.tipe === 'Pemasukan') {
        // Pinjam → nambah utang (uang tidak masuk dompet)
        utangTotal += t.nominal;
      } else {
        // Bayar → utang turun, kas turun (uang keluar dompet)
        utangTotal -= t.nominal;
        saldoKas -= t.nominal;
      }
    } else if (isPiutang) {
      if (t.tipe === 'Pengeluaran') {
        // Kasih pinjam → kas turun, piutang naik
        piutangTotal += t.nominal;
        saldoKas -= t.nominal;
      } else {
        // Orang balikin → kas naik, piutang turun
        piutangTotal -= t.nominal;
        saldoKas += t.nominal;
      }
    } else {
      // Income / Expense biasa
      if (t.tipe === 'Pemasukan') {
        saldoKas += t.nominal;
        totalIncome += t.nominal;
      } else {
        saldoKas -= t.nominal;
        totalExpense += t.nominal;
      }
    }
  });

  // Saldo kas = total semua dompet (BCA + Cash) bila dompet sudah ada
  if (DB.wallets && DB.wallets.length) {
    const wb = walletBalances();
    saldoKas = Object.keys(wb).reduce((a, k) => a + wb[k], 0);
  }

  const totalInvestasi = DB.assets.reduce((a, b) => a + Number(b.value || 0), 0);
  const netWorth = saldoKas + totalInvestasi + piutangTotal - utangTotal;

  // ========================================================
  // 2. SIKLUS INI — filter dengan isInPeriod (payroll day)
  // ========================================================
  const txs = DB.transactions
    .map((t, i) => ({ ...t, _idx: i }))
    .filter(t => isInPeriod(t.tanggal, period))
    .sort((a, b) => {
      const dc = String(b.tanggal).localeCompare(String(a.tanggal));
      if (dc !== 0) return dc;
      return b._idx - a._idx;
    });

  console.log('[renderDashboard] tx siklus ini =', txs.length);

  let monthIn = 0, monthOut = 0;
  txs.forEach(t => {
    if (t.kategori.startsWith('Utang') || t.kategori.startsWith('Piutang')) return;
    if (t.tipe === 'Pemasukan') monthIn += t.nominal;
    else monthOut += t.nominal;
  });

  // ========================================================
  // 3. UPDATE UI
  // ========================================================
  const setText = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.innerText = val;
  };

  // Net worth TOTAL (semua waktu)
  setText('dash-total-aset', formatRupiah(netWorth));
  setText('dash-saldo-aktif', formatRupiah(saldoKas));

  // Arus kas SIKLUS INI
  setText('dash-cash-in', '+' + formatRupiah(monthIn));
  setText('dash-cash-out', '-' + formatRupiah(monthOut));

  // Utang/Piutang & Investasi (total)
  setText('dash-hutang', formatRupiah(utangTotal));
  setText('dash-piutang', formatRupiah(piutangTotal));
  setText('dash-total-investasi', formatRupiah(totalInvestasi));

  // Update label dengan siklus gaji
  const periodLabel = getPeriodLabel(period, DB.payrollDay);
  document.querySelectorAll('.chartMonthLabel').forEach(el => {
    el.innerText = '(' + periodLabel + ')';
  });

  // ========================================================
  // 4. LIST PEMASUKAN & PENGELUARAN (siklus ini)
  // ========================================================
  const rItem = (t, colClass, iconCol, iconBG) => `
    <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-100 dark:border-slate-800 mb-2 hover:border-slate-300 dark:hover:border-slate-600 transition-colors group">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${iconCol} ${iconBG}">
          <i class="ph ph-receipt text-lg"></i>
        </div>
        <div class="truncate">
          <p class="text-sm font-bold text-slate-800 dark:text-white truncate">${escapeHtmlJS(t.kategori)}</p>
          <p class="text-[10px] text-slate-500">${escapeHtmlJS(String(t.tanggal).substring(5))} • ${escapeHtmlJS(t.keterangan || '-')}</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0 ml-2">
        <p class="${colClass} font-bold text-sm">${formatRupiah(t.nominal).replace(',00','')}</p>
        <div class="flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 sm:group-focus-within:opacity-100 transition-opacity">
          <button type="button" onclick="editTransaction('${escapeAttrJS(t.id)}')" aria-label="Edit transaksi ${escapeAttrJS(t.kategori)}" title="Edit" class="w-10 h-10 rounded-lg bg-blue-100 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 flex items-center justify-center hover:bg-blue-200 dark:hover:bg-blue-500/30">
            <i class="ph ph-pencil text-base" aria-hidden="true"></i>
          </button>
          <button type="button" onclick="deleteTransaction('${escapeAttrJS(t.id)}')" aria-label="Hapus transaksi ${escapeAttrJS(t.kategori)}" title="Hapus" class="w-10 h-10 rounded-lg bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 flex items-center justify-center hover:bg-rose-200 dark:hover:bg-rose-500/30">
            <i class="ph ph-trash text-base" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  `;

  const listIn = document.getElementById('listViewIn');
  const listOut = document.getElementById('listViewOut');

  if (listIn) {
    const inData = txs.filter(t => t.tipe === 'Pemasukan' && !t.kategori.startsWith('Utang') && !t.kategori.startsWith('Piutang'));
    listIn.innerHTML = inData.map(t => rItem(t, 'text-emerald-500', 'text-emerald-500', 'bg-emerald-50 dark:bg-emerald-500/10')).join('') ||
      '<p class="text-center text-xs text-slate-400 p-4">Kosong</p>';
  }
  if (listOut) {
    const outData = txs.filter(t => t.tipe === 'Pengeluaran' && !t.kategori.startsWith('Utang') && !t.kategori.startsWith('Piutang'));
    listOut.innerHTML = outData.map(t => rItem(t, 'text-rose-500', 'text-rose-500', 'bg-rose-50 dark:bg-rose-500/10')).join('') ||
      '<p class="text-center text-xs text-slate-400 p-4">Kosong</p>';
  }

  renderAssets();
  renderFinancialGoals();
}

function renderFinancialGoals() {
  const container = document.getElementById('financialGoals');
  if (!container) return;
  const goals = DB.goals || [];
  if (!goals.length) {
    container.innerHTML = `<p class="md:col-span-2 p-6 text-center rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 text-sm text-slate-500">${t('goal.empty')}</p>`;
  } else {
    container.innerHTML = goals.map((goal) => {
      const progress = FinanceAnalysis.goalProgress(goal.currentAmount, goal.targetAmount);
      const name = escapeHtmlJS(goal.name);
      const id = escapeAttrJS(goal.id);
      return `
        <article class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 sm:p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h4 class="font-bold text-slate-800 dark:text-white break-words">${name}</h4>
              <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">${escapeHtmlJS(t('goal.target'))}: ${formatRupiah(goal.targetAmount).replace(',00','')}</p>
            </div>
            <div class="flex shrink-0 gap-1">
              <button type="button" data-goal-action="edit" data-goal-id="${id}" aria-label="${escapeHtmlJS(t('goal.edit'))}: ${name}" class="w-11 h-11 rounded-lg text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-500/10">
                <i class="ph ph-pencil" aria-hidden="true"></i>
              </button>
              <button type="button" data-goal-action="delete" data-goal-id="${id}" aria-label="${escapeHtmlJS(t('goal.delete'))}: ${name}" class="w-11 h-11 rounded-lg text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-500/10">
                <i class="ph ph-trash" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="mt-4 flex items-center justify-between gap-2 text-xs">
            <span class="font-semibold text-slate-700 dark:text-slate-200">${formatRupiah(goal.currentAmount).replace(',00','')}</span>
            <span class="font-bold text-brand dark:text-brand-ink">${progress.toFixed(0)}%</span>
          </div>
          <div class="mt-2 h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden" role="progressbar" aria-label="${escapeHtmlJS(t('goal.progress'))}: ${name}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress.toFixed(0)}">
            <div class="h-full rounded-full bg-brand transition-[width]" style="width:${progress}%"></div>
          </div>
          <div class="mt-3 flex items-center justify-between gap-3">
            <p class="text-xs text-slate-500 dark:text-slate-400">${goal.targetDate ? `${escapeHtmlJS(t('goal.date'))}: ${escapeHtmlJS(goal.targetDate)}` : ''}</p>
            <button type="button" data-goal-action="progress" data-goal-id="${id}" class="min-h-[44px] px-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700">${t('goal.update_progress')}</button>
          </div>
        </article>
      `;
    }).join('');
  }

  if (container.dataset.bound !== 'true') {
    container.dataset.bound = 'true';
    container.addEventListener('click', (event) => {
      const button = event.target.closest('[data-goal-action]');
      if (!button) return;
      const id = button.dataset.goalId;
      if (button.dataset.goalAction === 'delete') deleteGoal(id);
      else if (button.dataset.goalAction === 'progress') openGoalForm(id, true);
      else openGoalForm(id, false);
    });
  }
}

async function openGoalForm(id, progressOnly) {
  const goal = (DB.goals || []).find((item) => item.id === id);
  if (id && !goal) return;
  const current = goal || { name: '', targetAmount: '', currentAmount: 0, targetDate: '' };
  const hasWallets = (DB.wallets || []).length > 0;
  const html = progressOnly
    ? `<div class="text-left space-y-2 text-sm">
         <label for="goalAddAmount" class="block font-semibold">Tambah tabungan baru (Rp)</label>
         <input id="goalAddAmount" type="number" min="0" step="0.01" placeholder="Contoh: 500000" class="swal2-input" style="margin:0 0 8px 0;width:100%">
         ${hasWallets ? `
           <label for="goalWallet" class="block font-semibold">Ambil dari dompet (opsional)</label>
           <select id="goalWallet" class="swal2-input" style="margin:0 0 8px 0;width:100%">
             <option value="">Catat progres saja (tanpa potong dompet)</option>
             ${walletOptions('')}
           </select>
         ` : ''}
         <hr class="my-2 border-slate-200 dark:border-slate-700">
         <label for="goalCurrent" class="block text-xs text-slate-500">Atau atur ulang total terkumpul langsung (Rp)</label>
         <input id="goalCurrent" type="number" min="0" step="0.01" value="${escapeHtmlJS(current.currentAmount)}" class="swal2-input" style="margin:0;width:100%" aria-label="${escapeHtmlJS(t('goal.current'))}">
       </div>`
    : `<label for="goalName" class="block text-left text-sm font-semibold mb-1">${t('goal.name')}</label>
       <input id="goalName" maxlength="80" value="${escapeHtmlJS(current.name)}" class="swal2-input" aria-label="${escapeHtmlJS(t('goal.name'))}">
       <label for="goalTarget" class="block text-left text-sm font-semibold mb-1">${t('goal.target')}</label>
       <input id="goalTarget" type="number" min="0.01" step="0.01" value="${escapeHtmlJS(current.targetAmount)}" class="swal2-input" aria-label="${escapeHtmlJS(t('goal.target'))}">
       <label for="goalCurrent" class="block text-left text-sm font-semibold mb-1">${t('goal.current')}</label>
       <input id="goalCurrent" type="number" min="0" step="0.01" value="${escapeHtmlJS(current.currentAmount)}" class="swal2-input" aria-label="${escapeHtmlJS(t('goal.current'))}">
       <label for="goalDate" class="block text-left text-sm font-semibold mb-1">${t('goal.date')}</label>
       <input id="goalDate" type="date" value="${escapeHtmlJS(current.targetDate)}" class="swal2-input" aria-label="${escapeHtmlJS(t('goal.date'))}">`;
  const result = await Swal.fire({
    title: progressOnly ? t('goal.update_progress') : goal ? t('goal.edit') : t('goal.add'),
    html,
    focusConfirm: false,
    showCancelButton: true,
    confirmButtonText: t('btn.simpan'),
    cancelButtonText: t('btn.batal'),
    customClass: { popup: getSwalClass() },
    preConfirm: () => {
      if (progressOnly) {
        const addEl = document.getElementById('goalAddAmount');
        const addAmount = Number(addEl ? addEl.value : 0);
        const walletEl = document.getElementById('goalWallet');
        const walletId = walletEl ? walletEl.value : '';
        if (addAmount > 0) {
          return { mode: 'contribute', goalId: current.id, amount: addAmount, walletId, tanggal: localToday() };
        }
      }
      const name = progressOnly ? current.name : document.getElementById('goalName').value.trim();
      const targetAmount = progressOnly ? Number(current.targetAmount) : Number(document.getElementById('goalTarget').value);
      const currentAmount = Number(document.getElementById('goalCurrent').value);
      const targetDate = progressOnly ? current.targetDate : document.getElementById('goalDate').value;
      if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 ||
          !Number.isFinite(currentAmount) || currentAmount < 0) {
        Swal.showValidationMessage(t('goal.form_invalid'));
        return false;
      }
      return { mode: 'save', id: current.id, name, targetAmount, currentAmount, targetDate };
    }
  });
  if (!result.isConfirmed) return;
  try {
    const response = result.value.mode === 'contribute'
      ? await callServer('api_contributeGoal', result.value)
      : await callServer('api_saveGoal', result.value);
    await refreshFromServer(response);
    await Swal.fire({ icon: 'success', title: t('goal.saved'), customClass: { popup: getSwalClass() } });
  } catch (error) {
    showActionError(error);
  }
}

async function deleteGoal(id) {
  const result = await Swal.fire({
    icon: 'warning',
    title: t('goal.confirm_delete'),
    showCancelButton: true,
    confirmButtonColor: '#e11d48',
    confirmButtonText: t('btn.hapus'),
    cancelButtonText: t('btn.batal'),
    customClass: { popup: getSwalClass() }
  });
  if (!result.isConfirmed) return;
  try {
    await refreshFromServer(await callServer('api_deleteGoal', id));
  } catch (error) {
    showActionError(error);
  }
}

/* ============================================================
   KALENDER — State bulan independen
   ============================================================ */
let kalenderYear = null;
let kalenderMonth = null;

function initKalenderState() {
  const now = new Date();
  if (kalenderYear === null || kalenderMonth === null) {
    kalenderYear = now.getFullYear();
    kalenderMonth = now.getMonth() + 1;
  }
}

function kalenderPrev() {
  initKalenderState();
  kalenderMonth--;
  if (kalenderMonth < 1) { kalenderMonth = 12; kalenderYear--; }
  renderKalender();
}

function kalenderNext() {
  initKalenderState();
  kalenderMonth++;
  if (kalenderMonth > 12) { kalenderMonth = 1; kalenderYear++; }
  renderKalender();
}

function kalenderToday() {
  const now = new Date();
  kalenderYear = now.getFullYear();
  kalenderMonth = now.getMonth() + 1;
  renderKalender();
}

/* ============================================================
   RENDER KALENDER
   ============================================================ */
function renderKalender() {
  const grid = document.getElementById('kalenderGrid');
  if (!grid) {
    console.warn('[Kalender] grid element tidak ditemukan');
    return;
  }

  initKalenderState();

  const year = kalenderYear;
  const month = kalenderMonth;
  const period = year + '-' + String(month).padStart(2, '0');

  const txs = DB.transactions.filter(t => String(t.tanggal).startsWith(period));
  console.log('[Kalender] Render:', period, '| tx:', txs.length);

  const byDay = {};
  txs.forEach(t => {
    const day = Number(String(t.tanggal).slice(8, 10));
    if (!byDay[day]) byDay[day] = { inAmt: 0, outAmt: 0, count: 0 };
    if (t.tipe === 'Pemasukan') byDay[day].inAmt += Number(t.nominal) || 0;
    else byDay[day].outAmt += Number(t.nominal) || 0;
    byDay[day].count++;
  });

     const labelEl = document.getElementById('kalenderMonthLabel');
  if (labelEl) {
    const monthLabel = getMonthName(month - 1) + ' ' + year;

    if (DB.payrollDay > 1) {
      const periodStr = year + '-' + String(month).padStart(2, '0');
      const range = getPeriodRange(periodStr, DB.payrollDay);
      const s = new Date(range.start + 'T00:00:00');
      const e = new Date(range.end + 'T00:00:00');
      const cycleLabel = s.getDate() + ' ' + getMonthShort(s.getMonth()) + ' - ' +
                         e.getDate() + ' ' + getMonthShort(e.getMonth());
      labelEl.innerHTML = '(' + monthLabel + ' · <span class="text-brand dark:text-brand-ink font-bold">' + t('cal.siklus') + ': ' + cycleLabel + '</span>)';
    } else {
      labelEl.textContent = '(' + monthLabel + ')';
    }
  }
  const firstDay = new Date(year, month - 1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  let firstDayOfWeek = firstDay.getDay();
  firstDayOfWeek = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;

  grid.innerHTML = '';

  const emptyCellClass = 'min-h-[80px] sm:min-h-[90px] border-b border-r border-slate-100 dark:border-slate-800/60 bg-slate-50/40 dark:bg-slate-900/40';

  for (let i = 0; i < firstDayOfWeek; i++) {
    const empty = document.createElement('div');
    empty.className = emptyCellClass;
    grid.appendChild(empty);
  }

  const today = new Date();
  const isCurrentMonthView = today.getFullYear() === year && (today.getMonth() + 1) === month;
  const todayDate = today.getDate();

  let totalIn = 0, totalOut = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    const data = byDay[d] || { inAmt: 0, outAmt: 0, count: 0 };
    totalIn += data.inAmt;
    totalOut += data.outAmt;
    const net = data.inAmt - data.outAmt;
    const hasData = data.count > 0;
    const isToday = isCurrentMonthView && d === todayDate;

    let bgClass = 'bg-white dark:bg-slate-900';
    if (hasData) {
      if (net > 0) bgClass = 'bg-emerald-50/70 dark:bg-emerald-500/10';
      else if (net < 0) bgClass = 'bg-rose-50/70 dark:bg-rose-500/10';
      else bgClass = 'bg-amber-50/70 dark:bg-amber-500/10';
    }

    const dateStr = period + '-' + String(d).padStart(2, '0');
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'text-left align-top min-h-[80px] sm:min-h-[90px] p-1.5 sm:p-2 border-b border-r border-slate-100 dark:border-slate-800/60 relative transition-colors hover:bg-slate-100/70 dark:hover:bg-slate-800/60 focus-visible:ring-2 focus-visible:ring-brand ' + bgClass;
    if (isToday) cell.classList.add('ring-2', 'ring-inset', 'ring-brand');
    cell.title = hasData ? (data.count + ' transaksi · Net: ' + formatRupiah(net)) : ('Lihat atau tambah transaksi ' + dateStr);
    cell.setAttribute('aria-label', dateStr + (hasData ? (', ' + data.count + ' transaksi') : ''));
    cell.addEventListener('click', () => openCalendarDayModal(dateStr));

    let html = '<div class="flex items-center justify-between mb-1">';
    html += '<span class="text-[11px] sm:text-xs font-bold ' +
      (isToday ? 'text-brand dark:text-brand-ink' : 'text-slate-700 dark:text-slate-200') + '">' + d + '</span>';
    if (hasData) {
      html += '<span class="text-[8px] font-bold text-slate-400 dark:text-slate-500">' + data.count + 'x</span>';
    }
    html += '</div>';

    if (hasData) {
      if (data.inAmt > 0) {
        html += '<p class="text-[9px] sm:text-[10px] font-bold text-emerald-600 dark:text-emerald-400 leading-tight truncate">+' +
          formatShortIDR(data.inAmt) + '</p>';
      }
      if (data.outAmt > 0) {
        html += '<p class="text-[9px] sm:text-[10px] font-bold text-rose-600 dark:text-rose-400 leading-tight truncate">−' +
          formatShortIDR(data.outAmt) + '</p>';
      }
      if (data.inAmt > 0 && data.outAmt > 0) {
        html += '<p class="text-[9px] sm:text-[10px] font-black mt-0.5 ' +
          (net >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400') + '">= ' +
          (net >= 0 ? '+' : '−') + formatShortIDR(Math.abs(net)) + '</p>';
      }
    }

    cell.innerHTML = html;
    grid.appendChild(cell);
  }

  const totalCells = firstDayOfWeek + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < remaining; i++) {
    const empty = document.createElement('div');
    empty.className = emptyCellClass;
    grid.appendChild(empty);
  }

  const elIn = document.getElementById('kalenderTotalIn');
  const elOut = document.getElementById('kalenderTotalOut');
  const elNet = document.getElementById('kalenderTotalNet');
  const net = totalIn - totalOut;

  if (elIn) elIn.textContent = formatRupiah(totalIn);
  if (elOut) elOut.textContent = formatRupiah(totalOut);
  if (elNet) {
    elNet.textContent = formatRupiah(net);
    elNet.className = 'text-base sm:text-lg font-black truncate ' +
      (net > 0 ? 'text-emerald-600 dark:text-emerald-500' :
       net < 0 ? 'text-rose-600 dark:text-rose-500' :
       'text-slate-700 dark:text-white');
  }
}

function formatShortIDR(n) {
  if (hideNominal) return '•••';
  n = Math.abs(Math.round(Number(n) || 0));
  if (n >= 1000000000) return (n / 1000000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000000)    return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'jt';
  if (n >= 1000)       return (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'rb';
  return String(n);
}

      ? `<span class="text-[10px] text-slate-400">${qty} gram · Emas</span>`
      : isUsd
      ? `<span class="text-[10px] text-slate-400">$${qty.toLocaleString('id-ID')} USD · Valas</span>`

      : `<span class="text-[10px] text-slate-400">${escapeHtmlJS(a.type)}</span>`;

    const pnlHtml = (isCrypto || isEmas || isUsd) && buyTotal > 0
      ? `<div class="text-[10px] font-bold ${pnl >= 0 ? 'text-emerald-500' : 'text-rose-500'}">
           ${pnl >= 0 ? '+' : ''}${formatRupiah(pnl).replace(',00','')} (${pnlPct.toFixed(1)}%)
         </div>`

    return `

  container.querySelectorAll('[data-debt-action]').forEach((button) => {

      if (debtAction === 'edit' || debtAction === 'delete') {
        manageDebtEntity(debtAction, debtGroup, debtName);
      } else if (debtAction === 'add' || debtAction === 'pay') {
        transactDebt(debtAction, debtGroup, debtName);
      }
    });
  });

async function manageDebtEntity(action, group, oldName = '') {
  if (action === 'delete') {
    Swal.fire({
      title: `Hapus ${oldName}?`,

      icon: 'warning',
      showCancelButton: true,

    }).then(async r => {

          await refreshFromServer(data);
        } catch (e) { showActionError(e); }
      }
    });
    return;
  }

  const title = action === 'add' ? (group === 'UtangApp' ? 'Nama Aplikasi' : 'Nama Orang') : 'Edit Nama';
  const { value: name } = await Swal.fire({
    title: title,
    input: 'text',

        data = await callServer('api_updateEntity', group, oldName, name);

      await refreshFromServer(data);
    } catch (e) { showActionError(e); }
  }
}

/* ============================================================
   DOMPET (BCA / CASH), TRANSFER, TARIK TUNAI, TOP-UP ASET
   ============================================================ */
const isPiutangK = (k) => String(k).startsWith('Piutang');
const isUtangK = (k) => !isPiutangK(k) && String(k).startsWith('Utang');

function localToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Siklus gaji untuk sebuah tanggal (sama dengan getCycleForDate di server)
function cycleOfDate(tanggal) {
  const pd = Number(DB.payrollDay) || 1;
  let [y, m, d] = String(tanggal).slice(0, 10).split('-').map(Number);
  if (pd > 1 && d >= pd) { m += 1; if (m > 12) { m = 1; y += 1; } }
  return y + '-' + String(m).padStart(2, '0');
}

// Efek transaksi ke dompet: pinjam utang tidak memasukkan uang ke dompet (aturan lama dipertahankan)
function txCashEffect(t) {
  const n = Number(t.nominal) || 0;
  if (isPiutangK(t.kategori)) return t.tipe === 'Pengeluaran' ? -n : n;
  if (isUtangK(t.kategori)) return t.tipe === 'Pemasukan' ? 0 : -n;
  return t.tipe === 'Pemasukan' ? n : -n;
}

function walletBalances() {
  const bal = {};
  (DB.wallets || []).forEach(w => { bal[w.id] = Number(w.openingBalance) || 0; });
  const def = DB.wallets && DB.wallets[0] ? DB.wallets[0].id : null;
  DB.transactions.forEach(t => {
    const id = (t.walletId && bal[t.walletId] !== undefined) ? t.walletId : def;
    if (id) bal[id] += txCashEffect(t);
  });
  (DB.transfers || []).forEach(x => {
    const n = Number(x.nominal) || 0, f = Number(x.fee) || 0;
    if (x.fromWallet && bal[x.fromWallet] !== undefined) bal[x.fromWallet] -= (n + f);
    if (x.toWallet && bal[x.toWallet] !== undefined) bal[x.toWallet] += n;
  });
  return bal;
}

async function openTransferModal(kind) {
  const ws = DB.wallets || [];
  if (ws.length < 2) {

  }

  const toWallet = kind === 'tarik_tunai'

    : ws.find(w => w.id !== fromWallet.id);

    title: kind === 'tarik_tunai' ? 'Tarik Tunai / Transfer Antar Dompet' : 'Transfer Antar Dompet',
    html: `

      <select id="tf-from" class="swal2-input">${walletOptions(fromWallet.id)}</select>

    customClass: { popup: getSwalClass() },

      const from = document.getElementById('tf-from').value;
      const to = document.getElementById('tf-to').value;
      const nominal = parseFloat(document.getElementById('tf-nom').value);

  const res = await Swal.fire({
    title: 'Tambah ' + a.name,
    html: `
      <input id="tu-amount" type="number" class="swal2-input" placeholder="Nominal ditambah (Rp), mis. 1000000">

          ? `Kosongkan keduanya untuk memakai harga terakhir (${formatRupiah(implied)} per ${escapeHtmlJS(a.symbol)}).`

    cancelButtonText: 'Batal',

async function withdrawAsset(id) {
  const a = (DB.assets || []).find(x => String(x.id) === String(id));
  if (!a) return;
  const isCrypto = String(a.type).toLowerCase() === 'crypto';
  const val = Number(a.value || 0);
  const qty = Number(a.quantity || 0);
  const res = await Swal.fire({
    title: 'Cairkan / Jual ' + escapeHtmlJS(a.name),
    html: `
      <label for="wd-amount" style="font-size:12px;color:#64748b;display:block;text-align:left;margin:4px 4px 0">Nominal dicairkan (maks. ${formatRupiah(val)})</label>

      ${isCrypto && qty > 0 ? `
        <label for="wd-qty" style="font-size:12px;color:#64748b;display:block;text-align:left;margin:8px 4px 0">Jumlah koin dijual (${qty} ${escapeHtmlJS(a.symbol)}) — opsional</label>

    cancelButtonText: 'Batal',
    customClass: { popup: getSwalClass() },
    preConfirm: () => {
      const amount = parseFloat(document.getElementById('wd-amount').value);
      if (!Number.isFinite(amount) || amount <= 0 || amount > val + 1) {
        Swal.showValidationMessage('Nominal harus di antara 1 sampai nilai aset saat ini.');
        return false;
      }
      const qtyEl = document.getElementById('wd-qty');

async function transactDebt(type, group, name) {
  let isIncome = false;
  let title = '';
  if (group === 'UtangApp' || group === 'UtangPerson') {
    isIncome = (type === 'add');
    title = type === 'add' ? `Pinjam dari ${name}` : `Bayar utang ke ${name}`;
  } else {
    isIncome = (type === 'pay');
    title = type === 'add' ? `Beri pinjaman ke ${name}` : `Terima bayaran dari ${name}`;
  }

  const affectsCash = !((group === 'UtangApp' || group === 'UtangPerson') && type === 'add');
  const walletSel = affectsCash && (DB.wallets || []).length
    ? `<label style="font-size:12px;color:#64748b;display:block;text-align:left;margin:8px 4px 0">${isIncome ? 'Masuk ke dompet' : 'Dibayar dari dompet'}</label><select id="swal-wallet" class="swal2-input">${walletOptions('')}</select>`
    : '';

  const { value: formVals } = await Swal.fire({
    title: title,
    html: `
      <input id="swal-nom" class="swal2-input bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white" type="number" placeholder="Nominal Rp">
      <input id="swal-ket" class="swal2-input bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white" type="text" placeholder="Catatan Opsional">
      ${walletSel}
    `,
    focusConfirm: false,
    showCancelButton: true,
    customClass: { popup: getSwalClass() },
    preConfirm: () => [
      document.getElementById('swal-nom').value,
      document.getElementById('swal-ket').value,
      (document.getElementById('swal-wallet') || {}).value || ''
    ]
  });

  if (formVals && formVals[0]) {
    const nominal = parseFloat(formVals[0]);
    if (!nominal || nominal <= 0) return;

    const today = localToday();
    const payload = {
      tanggal: today,
      tipe: isIncome ? 'Pemasukan' : 'Pengeluaran',
      kategori: `${group} - ${name}`,
      nominal: nominal,
      keterangan: formVals[1] || '',
      walletId: formVals[2] || ''
    };

    try {
      const data = await callServer('api_addTransaction', payload);
      await refreshFromServer(data);
      Swal.fire({ icon: 'success', title: 'Tercatat', timer: 1000, showConfirmButton: false, customClass: { popup: getSwalClass() } });
    } catch (e) { showActionError(e); }
  }
}

async function submitTransaction(e) {
  e.preventDefault();
  const rowId = document.getElementById('tr_row').value;

  let tanggal = document.getElementById('tr_tanggal').value;
  if ((!tanggal || tanggal === '') && fpTanggal && fpTanggal.selectedDates && fpTanggal.selectedDates.length > 0) {
    const d = fpTanggal.selectedDates[0];
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    tanggal = `${y}-${m}-${day}`;
  }

  const p = {
    tanggal: tanggal,
    tipe: document.getElementById('tr_tipe').value,
    kategori: document.getElementById('tr_kategori').value,
    nominal: parseFloat(document.getElementById('tr_nominal').value),
    keterangan: document.getElementById('tr_keterangan').value,
    walletId: (document.getElementById('tr_wallet') || {}).value || ''
  };

  if (!p.tanggal || !/^\d{4}-\d{2}-\d{2}/.test(p.tanggal) || !p.nominal || p.nominal <= 0) {
    Swal.fire({
      icon: 'error',
      title: 'Data tidak valid',
      text: 'Isi tanggal (format YYYY-MM-DD) dan nominal dengan benar.',
      customClass: { popup: getSwalClass() }
    });
    return;
  }

  const txMonth = cycleOfDate(p.tanggal);   // siklus gaji, bukan bulan kalender
  const needPeriodSwitch = txMonth !== DB.currentPeriod;

  try {
    let data;
    if (rowId) {
      data = await callServer('api_updateTransaction', rowId, p);
    } else {
      data = await callServer('api_addTransaction', p);
    }

    if (needPeriodSwitch) {
      await callServer('api_savePeriod', txMonth);
      data.currentPeriod = txMonth;
      if (fpMonth) {
        try { fpMonth.setDate(txMonth, false); } catch (err) {}
      }
    }

    await refreshFromServer(data);

    Swal.fire({
      icon: 'success',
      title: 'Tersimpan!',
      html: `Transaksi <b>${p.tipe}</b> sebesar <b>${formatRupiah(p.nominal)}</b> berhasil dicatat.`,
      timer: 1500,
      showConfirmButton: false,
      customClass: { popup: getSwalClass() }
    });

    switchView('dashboard');
  } catch (err) {
    console.error('[submitTransaction] error:', err);
    Swal.fire({
      icon: 'error',
      title: 'Gagal menyimpan',
      text: String(err && err.message ? err.message : err),
      customClass: { popup: getSwalClass() }
    });
  }
}

function renderLaporan() {
  const start = document.getElementById('lapStart');
  const end = document.getElementById('lapEnd');
  if (laporanState.period !== DB.currentPeriod) {
    const range = getPeriodRange(DB.currentPeriod, DB.payrollDay);
    if (start) start.value = range.start;
    if (end) end.value = range.end;
    laporanState.period = DB.currentPeriod;
    laporanState.dirty = true;
    laporanState.page = 0;
  }
  renderReportCategories();
  renderReportWallets();
  loadReportPage();
}

function renderReportWallets() {
  const select = document.getElementById('lapWallet');
  if (!select) return;
  const current = select.value;
  const wallets = DB.wallets || [];
  select.innerHTML = `<option value="">${escapeHtmlJS(t('lap.all_wallets'))}</option>` +
    wallets.map((w) => `<option value="${escapeHtmlJS(w.id)}">${escapeHtmlJS(w.name)}</option>`).join('');
  if (wallets.some((w) => w.id === current)) select.value = current;
}

function renderReportCategories() {
  const select = document.getElementById('lapCategory');
  if (!select) return;
  const current = select.value;
  const categories = Array.from(new Set([
    ...(DB.categories.pemasukan || []),
    ...(DB.categories.pengeluaran || []),
    ...DB.transactions.map((transaction) => transaction.kategori)
  ].filter(Boolean))).sort((left, right) => left.localeCompare(right));
  select.innerHTML = `<option value="">${escapeHtmlJS(t('lap.all_categories'))}</option>` +
    categories.map((category) =>
      `<option value="${escapeHtmlJS(category)}">${escapeHtmlJS(category)}</option>`
    ).join('');
  if (categories.includes(current)) select.value = current;
}

function bindReportControls() {
  const search = document.getElementById('lapSearch');
  if (!search || search.dataset.bound === 'true') return;
  search.dataset.bound = 'true';
  const filterIds = ['lapStart', 'lapEnd', 'lapType', 'lapCategory', 'lapWallet'];
  const reload = () => {
    laporanState.page = 0;
    laporanState.dirty = true;
    loadReportPage();
  };
  search.addEventListener('input', () => {
    window.clearTimeout(laporanState.searchTimer);
    laporanState.searchTimer = window.setTimeout(reload, 250);
  });
  filterIds.forEach((id) => {
    const control = document.getElementById(id);
    if (control) control.addEventListener('change', reload);
  });
  const previous = document.getElementById('lapPrev');
  const next = document.getElementById('lapNext');
  if (previous) previous.addEventListener('click', () => {
    if (laporanState.page > 0) {
      laporanState.page -= 1;
      laporanState.dirty = true;
      loadReportPage();
    }
  });
  if (next) next.addEventListener('click', () => {
    if ((laporanState.page + 1) * laporanState.pageSize < laporanState.total) {
      laporanState.page += 1;
      laporanState.dirty = true;
      loadReportPage();
    }
  });

  const importButton = document.getElementById('lapImportBtn');
  const input = document.getElementById('lapCsvInput');
  if (importButton && input) {
    importButton.addEventListener('click', () => input.click());
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      if (file) await importTransactionsCsv(file);
      input.value = '';
    });
  }
}

function retryReportLoad() {
  laporanState.dirty = true;
  loadReportPage();
}

async function loadReportPage() {
  const tbody = document.getElementById('table-laporan');
  if (!tbody) return;
  const start = document.getElementById('lapStart');
  const end = document.getElementById('lapEnd');
  const search = document.getElementById('lapSearch');
  const type = document.getElementById('lapType');
  const category = document.getElementById('lapCategory');
  const wallet = document.getElementById('lapWallet');
  const status = document.getElementById('lapStatus');
  const pageStatus = document.getElementById('lapPageStatus');
  const previous = document.getElementById('lapPrev');
  const next = document.getElementById('lapNext');
  const filters = {
    start: start ? start.value : '',
    end: end ? end.value : '',
    search: search ? search.value.trim() : '',
    type: type ? type.value : '',
    category: category ? category.value : '',
    walletId: wallet ? wallet.value : '',
    offset: laporanState.page * laporanState.pageSize,
    limit: laporanState.pageSize
  };
  const key = JSON.stringify(filters);
  if (!laporanState.dirty && laporanState.queryKey === key) return;
  const requestId = ++laporanState.requestId;
  laporanState.queryKey = key;
  laporanState.dirty = false;
  if (status) status.textContent = t('lap.loading');
  if (pageStatus) pageStatus.textContent = '';
  if (previous) previous.disabled = true;
  if (next) next.disabled = true;
  tbody.innerHTML = `<tr><td colspan="6" class="px-8 py-16 text-center text-slate-500">${escapeHtmlJS(t('lap.loading'))}</td></tr>`;

  try {
    const result = await callServer('api_searchTransactions', filters);
    if (requestId !== laporanState.requestId) return;
    laporanState.rows = result.transactions || [];
    laporanState.total = Number(result.totalCount) || 0;
    if (status) status.textContent = '';
    renderReportRows(laporanState.rows);
    const first = laporanState.total ? filters.offset + 1 : 0;
    const last = Math.min(filters.offset + laporanState.rows.length, laporanState.total);
    if (pageStatus) {
      pageStatus.textContent = `${t('lap.page_range')} ${first}–${last} ${t('lap.of')} ${laporanState.total}`;
    }
    if (previous) previous.disabled = laporanState.page === 0;
    if (next) next.disabled = (laporanState.page + 1) * laporanState.pageSize >= laporanState.total;
  } catch (error) {
    if (requestId !== laporanState.requestId) return;
    laporanState.dirty = true;
    if (status) status.textContent = String(error.message || error);
    tbody.innerHTML = `<tr><td colspan="6" class="px-8 py-12 text-center">
      <p class="text-rose-600 dark:text-rose-400 mb-3">${escapeHtmlJS(t('lap.load_error'))}</p>
      <button type="button" onclick="retryReportLoad()" class="min-h-[44px] px-4 rounded-xl bg-brand text-white font-semibold">${escapeHtmlJS(t('lap.retry'))}</button>
    </td></tr>`;
  }
}

function renderReportRows(txs) {
  const tbody = document.getElementById('table-laporan');
  if (!tbody) return;
  if (!txs.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="px-8 py-16 text-center text-slate-500 dark:text-slate-400">${escapeHtmlJS(t('lap.no_results'))}</td></tr>`;
    return;
  }

  tbody.innerHTML = txs.map((r) => {
    const isM = r.tipe === 'Pemasukan';
    const badgeColor = isM
      ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400'
      : 'bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400';
    const textColor = isM ? 'text-emerald-500' : 'text-rose-500';
    const symbol = isM ? '+' : '-';

    return `
      <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
        <td class="px-6 py-4">${escapeHtmlJS(r.tanggal)}</td>
        <td class="px-6 py-4"><span class="px-2 py-1 rounded-md text-[10px] font-bold ${badgeColor}">${escapeHtmlJS(r.tipe)}</span></td>
        <td class="px-6 py-4 font-bold text-slate-800 dark:text-white">${escapeHtmlJS(r.kategori)}</td>
        <td class="px-6 py-4">${escapeHtmlJS(r.keterangan || '-')}</td>
        <td class="px-6 py-4 text-right font-bold ${textColor}">${symbol} ${formatRupiah(r.nominal)}</td>
        <td class="px-6 py-4 text-center">
          <button type="button" onclick="editTransaction('${escapeAttrJS(r.id)}')" aria-label="${escapeHtmlJS(t('lap.edit'))}" class="w-11 h-11 text-blue-500 hover:text-blue-700"><i class="ph ph-pencil text-lg" aria-hidden="true"></i></button>
          <button type="button" onclick="deleteTransaction('${escapeAttrJS(r.id)}')" aria-label="${escapeHtmlJS(t('lap.delete'))}" class="w-11 h-11 text-rose-500 hover:text-rose-700"><i class="ph ph-trash text-lg" aria-hidden="true"></i></button>
        </td>
      </tr>
    `;
  }).join('');

async function importTransactionsCsv(file) {
  if (file.size > 2 * 1024 * 1024) {
    showActionError(new Error(t('lap.import_limit')));
    return;
  }
  try {
    const text = await file.text();
    const parsedRows = TransactionImport.parseRows(text);
    if (parsedRows.length > 501) throw new Error(t('lap.import_limit'));
    const result = TransactionImport.parseTransactionCsv(text, DB.transactions, DB.wallets);
    const preview = result.rows.slice(0, 5).map((item) => {
      const rowText = `${item.transaction.tanggal} · ${item.transaction.kategori} · ${Number.isFinite(item.transaction.nominal) ? formatRupiah(item.transaction.nominal) : '-'}`;
      const issue = item.errors.length ? item.errors.join(' ') :
        (item.duplicate ? t('lap.import_duplicates') : '');
      return `<li class="py-1"><strong>${t('lap.csv_line')} ${item.line}:</strong> ${escapeHtmlJS(rowText)}${issue ? ` <span class="text-rose-600 dark:text-rose-400">${escapeHtmlJS(issue)}</span>` : ''}</li>`;
    }).join('');
    const invalidRows = result.rows
      .filter((item) => item.errors.length)
      .map((item) => `<li class="py-1"><strong>${t('lap.csv_line')} ${item.line}:</strong> ${escapeHtmlJS(item.errors.join(' '))}</li>`)
      .join('');
    const html = `
      <div class="text-left text-sm space-y-2">
        <p>${escapeHtmlJS(t('lap.import_valid'))}: <strong>${result.valid.length}</strong></p>
        <p>${escapeHtmlJS(t('lap.import_duplicates'))}: <strong>${result.duplicateCount}</strong></p>
        <p>${escapeHtmlJS(t('lap.import_invalid'))}: <strong>${result.invalidCount}</strong></p>
        <ul class="max-h-32 overflow-y-auto text-xs text-slate-600 dark:text-slate-300">${preview}</ul>
        ${invalidRows ? `<div><h4 class="font-semibold">${escapeHtmlJS(t('lap.import_invalid'))}</h4><ul class="max-h-40 overflow-y-auto text-xs text-rose-600 dark:text-rose-400">${invalidRows}</ul></div>` : ''}
      </div>
    `;
    const confirmation = await Swal.fire({
      icon: result.valid.length ? 'info' : 'warning',
      title: t('lap.import_preview'),
      html,
      showCancelButton: true,
      showConfirmButton: result.valid.length > 0,
      confirmButtonText: `${t('lap.import_confirm')} (${result.valid.length})`,
      cancelButtonText: t('btn.batal'),
      customClass: { popup: getSwalClass() }
    });
    if (!confirmation.isConfirmed || !result.valid.length) return;
    const response = await callServer('api_importTransactions', result.valid);
    await refreshFromServer(response);
    await Swal.fire({
      icon: 'success',
      title: t('lap.import_done'),
      text: `${response.addedCount} · ${t('lap.import_duplicates')}: ${response.skippedCount}`,
      customClass: { popup: getSwalClass() }
    });
  } catch (error) {
    showActionError(error);
  }
}

function getFilteredReportTransactions() {
  const start = (document.getElementById('lapStart') || {}).value || getPeriodRange(DB.currentPeriod, DB.payrollDay).start;
  const end = (document.getElementById('lapEnd') || {}).value || getPeriodRange(DB.currentPeriod, DB.payrollDay).end;
  const search = ((document.getElementById('lapSearch') || {}).value || '').trim().toLocaleLowerCase();
  const type = (document.getElementById('lapType') || {}).value || '';
  const category = (document.getElementById('lapCategory') || {}).value || '';
  const walletId = (document.getElementById('lapWallet') || {}).value || '';
  const txs = DB.transactions.filter((transaction) =>
    transaction.tanggal >= start &&
    transaction.tanggal <= end &&
    (!type || transaction.tipe === type) &&
    (!category || transaction.kategori === category) &&
    (!walletId || transaction.walletId === walletId) &&
    (!search || `${transaction.kategori} ${transaction.keterangan || ''}`.toLocaleLowerCase().includes(search))
  ).sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)));
  return { txs, period: `${start}_${end}` };
}

function csvEscapeCell(val) {
  const s = String(val == null ? '' : val);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const { txs, period } = getFilteredReportTransactions();
  if (txs.length === 0) {
    Swal.fire({ icon: 'warning', title: 'Kosong', text: 'Tidak ada data untuk diekspor', customClass: { popup: getSwalClass() } });
    return;
  }
  const header = ['tanggal', 'tipe', 'kategori', 'nominal', 'keterangan', 'dompet'];
  const lines = [header.join(',')].concat(
    txs.map((r) => [
      csvEscapeCell(r.tanggal),
      csvEscapeCell(r.tipe),
      csvEscapeCell(r.kategori),
      csvEscapeCell(r.nominal),
      csvEscapeCell(r.keterangan || ''),
      csvEscapeCell(walletName(r.walletId))
    ].join(','))
  );
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = `Laporan_Keuangan_${sessionUser}_${period || 'All'}.csv`;
  anchor.click();
  URL.revokeObjectURL(url);
}

function exportPDF() {
  const { txs, period } = getFilteredReportTransactions();

  if (txs.length === 0) {

  }

  const { jsPDF } = window.jspdf;

  txs.forEach(r => {
    if (r.tipe === 'Pemasukan') totalMasuk += r.nominal;

  });

  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.setTextColor(15, 23, 42);
  doc.text("MyKeuanganGuech", 14, 22);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.setTextColor(100, 116, 139);
  doc.text("Laporan Transaksi Finansial", 14, 28);

  doc.setFontSize(10);
  doc.setTextColor(15, 23, 42);
  doc.text(`Pengguna: ${sessionUser}`, pageWidth - 14, 22, { align: 'right' });
  doc.text(`Periode: ${period || 'Semua Waktu'}`, pageWidth - 14, 28, { align: 'right' });
  doc.text(`Dicetak: ${new Date().toLocaleDateString('id-ID')}`, pageWidth - 14, 34, { align: 'right' });

  doc.setDrawColor(226, 232, 240);
  doc.setLineWidth(0.5);
  doc.line(14, 40, pageWidth - 14, 40);

  doc.setFillColor(236, 253, 245);
  doc.roundedRect(14, 46, 56, 22, 3, 3, 'F');
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.setTextColor(5, 150, 105);
  doc.text("TOTAL PEMASUKAN", 18, 54);
  doc.setFontSize(12);
  doc.text(formatRupiah(totalMasuk).replace(',00',''), 18, 62);

  doc.setFillColor(255, 241, 242);
  doc.roundedRect(74, 46, 56, 22, 3, 3, 'F');
  doc.setFontSize(9);
  doc.setTextColor(225, 29, 72);
  doc.text("TOTAL PENGELUARAN", 78, 54);
  doc.setFontSize(12);
  doc.text(formatRupiah(totalKeluar).replace(',00',''), 78, 62);

  const isSurplus = selisih >= 0;
  doc.setFillColor(isSurplus ? 239 : 255, isSurplus ? 246 : 241, isSurplus ? 255 : 242);
  doc.roundedRect(134, 46, 62, 22, 3, 3, 'F');
  doc.setFontSize(9);
  doc.setTextColor(isSurplus ? 37 : 225, isSurplus ? 99 : 29, isSurplus ? 235 : 72);
  doc.text("SURPLUS / DEFISIT", 138, 54);
  doc.setFontSize(12);
  doc.text(`${isSurplus ? '+' : ''}${formatRupiah(selisih).replace(',00','')}`, 138, 62);

  doc.autoTable({
    startY: 76,
    head: [['Tanggal', 'Tipe', 'Kategori', 'Catatan', 'Nominal']],
    body: txs.map(r => [
      r.tanggal, r.tipe, r.kategori, r.keterangan || '-',
      formatRupiah(r.nominal).replace(',00','')
    ]),
    theme: 'grid',
    headStyles: { fillColor: [15, 23, 42], textColor: 255, fontStyle: 'bold', halign: 'center' },
    styles: { fontSize: 9, cellPadding: 5, font: 'helvetica' },
    alternateRowStyles: { fillColor: [248, 250, 252] },
    columnStyles: {
      0: { cellWidth: 25 },
      1: { cellWidth: 25 },
      2: { cellWidth: 35 },
      4: { halign: 'right', fontStyle: 'bold', cellWidth: 35 }
    },
    didParseCell: function (data) {
      if (data.section === 'body' && data.column.index === 4) {
        const tipe = txs[data.row.index].tipe;
        if (tipe === 'Pemasukan') data.cell.styles.textColor = [5, 150, 105];
        else data.cell.styles.textColor = [225, 29, 72];
      }
    }
  });

  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(148, 163, 184);
    doc.text(
      `Halaman ${i} dari ${pageCount} | Dicetak oleh MyKeuanganGuech`,
      pageWidth / 2,
      doc.internal.pageSize.getHeight() - 10,
      { align: 'center' }
    );
  }

  doc.save(`Laporan_Keuangan_${sessionUser}_${period || 'All'}.pdf`);
}

    input: 'number',
    inputValue: currentJumlah,
    inputAttributes: { min: 0, step: 1000 },
    showCancelButton: true,
    confirmButtonText: t('btn.simpan'),
    cancelButtonText: t('btn.batal'),
    customClass: { popup: getSwalClass() }
  });

  if (newJumlah === null || newJumlah === undefined) return;
  const val = parseInt(newJumlah, 10);
  if (isNaN(val) || val < 0) return;

  try {
    const data = await callServer('api_saveBudget', kategori, DB.currentPeriod, val);
    await refreshFromServer(data);
  } catch (e) { showActionError(e); }
}

// State: budget ID mana yang sedang di-expand
let expandedBudgets = new Set();

function toggleBudgetExpand(id) {
  if (expandedBudgets.has(id)) {
    expandedBudgets.delete(id);
  } else {
    expandedBudgets.add(id);
  }
  renderBudgeting();
}

function renderBudgeting() {
  const container = document.getElementById('budgetList');
  const formKategori = document.getElementById('budgetKategori');
  const monthLabel = document.getElementById('budgetMonthLabel');

  if (!container) return;

  const period = DB.currentPeriod;
  const periodLabel = getPeriodLabel(period, DB.payrollDay);

  if (monthLabel) monthLabel.innerText = '(' + periodLabel + ')';
  renderBudgetAnalysis(period);

  if (formKategori) {
    const currentVal = formKategori.value;
    const pengeluaran = DB.categories.pengeluaran || [];
    formKategori.innerHTML = '<option value="">— ' + t('budget.kategori') + ' —</option>' +
      pengeluaran.map(k => `<option value="${escapeHtmlJS(k)}">${escapeHtmlJS(k)}</option>`).join('');
    if (currentVal) formKategori.value = currentVal;
  }

  const budgets = (DB.budgets || []).filter(b =>
    String(b.bulan).slice(0, 7) === period
  );

  const txs = DB.transactions.filter(t => isInPeriod(t.tanggal, period));
  const actualByCat = {};
  txs.forEach(t => {
    if (t.tipe !== 'Pengeluaran') return;
    if (t.kategori.startsWith('Utang') || t.kategori.startsWith('Piutang')) return;
    actualByCat[t.kategori] = (actualByCat[t.kategori] || 0) + t.nominal;
  });

  if (budgets.length === 0) {
    container.innerHTML = `
      <div class="p-8 text-center">
        <i class="ph ph-piggy-bank text-5xl text-slate-300 dark:text-slate-600 mb-3"></i>
        <p class="text-sm text-slate-500">${t('budget.empty')}</p>
      </div>
    `;
    return;
  }

  budgets.sort((a, b) => String(a.kategori).localeCompare(String(b.kategori)));

  let html = '<div class="divide-y divide-slate-100 dark:divide-slate-800">';

  budgets.forEach(b => {
    const plan = Number(b.jumlah) || 0;
    const actual = actualByCat[b.kategori] || 0;
    const selisih = plan - actual;
    const pct = plan > 0 ? (actual / plan * 100) : 0;
    let status = { text: t('budget.aman'), color: 'emerald', icon: 'check-circle' };
    if (pct > 100) status = { text: t('budget.over'), color: 'rose', icon: 'warning-circle' };
    else if (pct >= 80) status = { text: t('budget.warning'), color: 'amber', icon: 'warning' };

    const selisihColor = selisih >= 0
      ? 'text-emerald-600 dark:text-emerald-400'
      : 'text-rose-600 dark:text-rose-400';
    const progressColor = pct > 100 ? 'bg-rose-500' : pct >= 80 ? 'bg-amber-500' : 'bg-emerald-500';

    const isExpanded = expandedBudgets.has(b.id);

    // Ambil transaksi kategori ini (siklus ini)
    const catTxns = txs
      .filter(t =>
        t.tipe === 'Pengeluaran' &&
        t.kategori === b.kategori
      )
      .sort((a, b) => {
        const dc = String(b.tanggal).localeCompare(String(a.tanggal));
        if (dc !== 0) return dc;
        return 0;
      });

    // Bangun list transaksi (kalau expand)
    let txnListHtml = '';
    if (isExpanded) {
      if (catTxns.length === 0) {
        txnListHtml = `
          <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-700 text-center">
            <p class="text-[11px] text-slate-400 italic">Belum ada transaksi kategori ini di siklus ini</p>
          </div>
        `;
      } else {
        txnListHtml = `
          <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-700 space-y-1.5">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">
              ${catTxns.length} Transaksi
            </p>
            ${catTxns.map(tx => `
              <div class="flex items-center justify-between gap-2 py-1.5 px-2 rounded-lg bg-white dark:bg-slate-900/50 border border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-2 min-w-0 flex-1">
                  <div class="w-1.5 h-1.5 rounded-full bg-rose-400 shrink-0"></div>
                  <div class="min-w-0 flex-1">
                    <p class="text-[11px] font-semibold text-slate-700 dark:text-slate-200 truncate">
                      ${escapeHtmlJS(tx.keterangan || '(tanpa catatan)')}
                    </p>
                    <p class="text-[9px] text-slate-400">${String(tx.tanggal).substring(5)}</p>
                  </div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <p class="text-[11px] font-black text-rose-600 dark:text-rose-400">−${formatRupiah(tx.nominal).replace(',00','')}</p>
                  <button type="button" data-budget-transaction="${escapeHtmlJS(tx.id)}" class="w-8 h-8 rounded bg-blue-50 dark:bg-blue-500/10 text-blue-500 flex items-center justify-center hover:bg-blue-100" aria-label="Edit transaksi" title="Edit">
                    <i class="ph ph-pencil text-[10px]" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    html += `
      <div class="transition-colors ${isExpanded ? 'bg-slate-50 dark:bg-slate-800/20' : ''}">
        <div class="p-4 sm:p-5 transition-colors group">
          <div class="flex items-start justify-between gap-3 mb-3">
            <button type="button" data-budget-expand="${escapeHtmlJS(b.id)}" aria-expanded="${isExpanded}" class="flex items-center gap-3 min-w-0 flex-1 text-left hover:bg-slate-50 dark:hover:bg-slate-800/30">
              <span class="w-10 h-10 rounded-xl bg-${status.color}-50 dark:bg-${status.color}-500/10 text-${status.color}-500 flex items-center justify-center shrink-0 relative">
                <i class="ph ph-${status.icon} text-lg" aria-hidden="true"></i>
              </span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-1.5">
                  <span class="font-bold text-slate-800 dark:text-white text-sm truncate">${escapeHtmlJS(b.kategori)}</span>
                  <i class="ph ph-caret-${isExpanded ? 'up' : 'down'} text-xs text-slate-400" aria-hidden="true"></i>
                </span>
                <span class="block text-[10px] text-${status.color}-600 dark:text-${status.color}-400 font-bold uppercase tracking-wider">
                  ${status.text} · ${pct.toFixed(0)}% · ${catTxns.length} transaksi
                </span>
              </span>
            </button>
            <div class="flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 sm:group-focus-within:opacity-100 transition-opacity">
              <button type="button" data-budget-action="edit" data-budget-id="${escapeHtmlJS(b.id)}" class="w-9 h-9 rounded-lg bg-blue-50 dark:bg-blue-500/10 text-blue-500 flex items-center justify-center hover:bg-blue-100" aria-label="Edit budget ${escapeHtmlJS(b.kategori)}" title="Edit">
                <i class="ph ph-pencil text-sm" aria-hidden="true"></i>
              </button>
              <button type="button" data-budget-action="delete" data-budget-id="${escapeHtmlJS(b.id)}" class="w-9 h-9 rounded-lg bg-rose-50 dark:bg-rose-500/10 text-rose-500 flex items-center justify-center hover:bg-rose-100" aria-label="Hapus budget ${escapeHtmlJS(b.kategori)}" title="Hapus">
                <i class="ph ph-trash text-sm" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 mb-3 text-xs">
            <div>
              <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${t('budget.plan')}</p>
              <p class="font-black text-slate-700 dark:text-white">${formatRupiah(plan).replace(',00','')}</p>
            </div>
            <div>
              <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${t('budget.actual')}</p>
              <p class="font-black text-slate-700 dark:text-white">${formatRupiah(actual).replace(',00','')}</p>
            </div>
            <div>
              <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${t('budget.selisih')}</p>
              <p class="font-black ${selisihColor}">${selisih >= 0 ? '+' : ''}${formatRupiah(selisih).replace(',00','')}</p>
            </div>
          </div>

          <div class="h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden" role="progressbar" aria-label="Progres budget ${escapeHtmlJS(b.kategori)}" aria-valuenow="${Math.min(pct, 100).toFixed(0)}" aria-valuemin="0" aria-valuemax="100">
            <div class="${progressColor} h-full rounded-full transition-all" style="width: ${Math.min(pct, 100).toFixed(1)}%"></div>
          </div>
        </div>

        ${isExpanded ? `<div class="px-4 sm:px-5 pb-4 sm:pb-5">${txnListHtml}</div>` : ''}
      </div>
    `;
  });

  html += '</div>';
  container.innerHTML = html;
  const budgetsById = new Map(budgets.map((budget) => [budget.id, budget]));
  container.querySelectorAll('[data-budget-expand]').forEach((button) => {
    button.addEventListener('click', () => toggleBudgetExpand(button.dataset.budgetExpand));
  });
  container.querySelectorAll('[data-budget-transaction]').forEach((button) => {
    button.addEventListener('click', () => editTransaction(button.dataset.budgetTransaction));
  });
  container.querySelectorAll('[data-budget-action]').forEach((button) => {
    button.addEventListener('click', () => {
      const budget = budgetsById.get(button.dataset.budgetId);
      if (!budget) return;
      if (button.dataset.budgetAction === 'edit') {
        editBudgetInline(budget.id, budget.kategori, Number(budget.jumlah) || 0);
      } else if (button.dataset.budgetAction === 'delete') {
        deleteBudget(budget.id, budget.kategori);
      }
    });
  });
}

async function settingPayrollDay() {
  const current = DB.payrollDay || 1;
  const { value: day } = await Swal.fire({
    title: t('payroll.title'),
    html: `
      <p style="font-size:13px;color:#64748b;margin-bottom:12px;">${t('payroll.desc')}</p>
      <input id="swal-payroll" type="number" min="1" max="28" value="${current}"
             class="swal2-input" placeholder="1-28"
             style="text-align:center;font-size:20px;font-weight:bold;">
      <p style="font-size:11px;color:#94a3b8;margin-top:12px;">${t('payroll.example')}: <b>28</b> → ${getPeriodLabel(DB.currentPeriod, 28)}</p>
      <p style="font-size:11px;color:#94a3b8;margin-top:4px;">${t('payroll.range_hint')}</p>
    `,
    focusConfirm: false,
    showCancelButton: true,
    confirmButtonText: t('btn.simpan'),
    cancelButtonText: t('btn.batal'),
    customClass: { popup: getSwalClass() },
    preConfirm: () => {
      const v = parseInt(document.getElementById('swal-payroll').value, 10);
      if (!v || v < 1 || v > 28) {
        Swal.showValidationMessage('1-28');
        return false;
      }
      return v;
    }
  });

  if (day) {
    try {
      await callServer('api_savePayrollDay', day);
      DB.payrollDay = Number(day);
      renderAll();

      const cycleLabel = getPeriodLabel(DB.currentPeriod, day);

      Swal.fire({
        icon: 'success',
        title: t('payroll.saved'),
        html: `<p style="font-size:14px;">${t('payroll.tanggal')}: <b>${day}</b></p>
               <p style="font-size:12px;color:#64748b;margin-top:8px;">
                 ${t('payroll.active_cycle')}: <b>${cycleLabel}</b>
               </p>`,
        timer: 2500,
        showConfirmButton: false,
        customClass: { popup: getSwalClass() }
      });
    } catch (e) {
      Swal.fire({
        icon: 'error', title: t('alert.failed'),
        text: String(e.message || e),
        customClass: { popup: getSwalClass() }
      });
    }
  }
}
