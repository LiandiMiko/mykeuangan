   ADMIN PANEL & TELEGRAM PAIRING
   ============================================================ */
let adminUsersCache = [];
let adminCurrentUserId = '';

async function loadAdminData() {
  const tbody = document.getElementById('adm-user-table');
  const setAdminText = (id, value) => {
    const element = document.getElementById(id);
    if (element) element.textContent = String(value);
  };
  if (tbody) {
    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">Memuat data pengguna...</td></tr>';
  }

  try {
    const data = await callServer('api_getAdminData');
    if (!data) throw new Error('Supabase tidak mengembalikan data panel admin.');

    adminUsersCache = data.users || [];
    adminCurrentUserId = data.currentUserId || '';

    const s = data.stats || {};
    setAdminText('adm-total-users', s.totalUsers || 0);
    setAdminText('adm-active-users', s.activeUsers || 0);
    setAdminText('adm-suspended-users', s.suspendedUsers || 0);
    setAdminText('adm-total-chats', s.totalTelegramChats || 0);

    filterAdminUsersTable();
    return true;
  } catch (err) {
    console.error('loadAdminData error:', err);
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="px-6 py-8 text-center text-rose-600 dark:text-rose-400">
            <p>Gagal memuat data pengguna: ${escapeHtmlJS(String(err.message || err))}</p>
            <button type="button" onclick="loadAdminData()" class="mt-3 min-h-[44px] px-3 font-bold underline cursor-pointer">Coba lagi</button>
          </td>
        </tr>
      `;
    }
    return false;
  }
}

function filterAdminUsersTable() {
  const tbody = document.getElementById('adm-user-table');
  const countEl = document.getElementById('adm-user-count');
  if (!tbody) return;

  const search = ((document.getElementById('admSearchInput') || {}).value || '').trim().toLocaleLowerCase();
  const filter = (document.getElementById('admFilterStatus') || {}).value || '';

  const filtered = adminUsersCache.filter((u) => {
    if (search) {
      const hay = `${u.display_name || ''} ${u.email || ''}`.toLocaleLowerCase();
      if (!hay.includes(search)) return false;
    }
    if (filter === 'active' || filter === 'suspended') {
      if (u.status !== filter) return false;
    } else if (filter === 'admin' || filter === 'user') {
      if (u.role !== filter) return false;
    }
    return true;
  });

  if (countEl) countEl.textContent = String(filtered.length);

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">Tidak ada pengguna yang cocok.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(u => {
    const isSuspended = u.status === 'suspended';
    const statusBadge = isSuspended
      ? '<span class="px-2 py-1 rounded-md text-[10px] font-bold bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400">Suspended</span>'
      : '<span class="px-2 py-1 rounded-md text-[10px] font-bold bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400">Active</span>';

    const roleBadge = u.role === 'admin'
      ? '<span class="px-2 py-1 rounded-md text-[10px] font-bold bg-purple-50 text-purple-600 dark:bg-purple-500/10 dark:text-purple-400">Admin</span>'
      : '<span class="px-2 py-1 rounded-md text-[10px] font-bold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">User</span>';

    const nextStatus = isSuspended ? 'active' : 'suspended';
    const statusBtnText = isSuspended ? 'Aktifkan' : 'Suspend';
    const statusBtnColor = isSuspended ? 'text-emerald-600 hover:text-emerald-800' : 'text-rose-500 hover:text-rose-700';

    const nextRole = u.role === 'admin' ? 'user' : 'admin';
    const roleBtnText = u.role === 'admin' ? 'Jadikan User' : 'Jadikan Admin';

    const safeId = escapeHtmlJS(u.id);
    const actions = u.id === adminCurrentUserId
      ? '<span class="text-slate-400">Akun Anda</span>'
      : `
        <button type="button" data-admin-action="status" data-user-id="${safeId}" data-value="${nextStatus}" class="min-h-[44px] px-2 font-bold cursor-pointer ${statusBtnColor}">${statusBtnText}</button>
        <button type="button" data-admin-action="role" data-user-id="${safeId}" data-value="${nextRole}" class="min-h-[44px] px-2 font-bold text-blue-500 hover:text-blue-700 cursor-pointer">${roleBtnText}</button>
        <button type="button" data-admin-action="password" data-user-id="${safeId}" class="min-h-[44px] px-2 font-bold text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white cursor-pointer">Atur Password</button>
      `;

    return `
      <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
        <td class="px-6 py-4">
          <p class="font-bold text-slate-800 dark:text-white">${escapeHtmlJS(u.display_name || 'User')}</p>
          <p class="text-[11px] text-slate-400">${escapeHtmlJS(u.email)}</p>
        </td>
        <td class="px-6 py-4">${roleBadge}</td>
        <td class="px-6 py-4">${statusBadge}</td>
        <td class="px-6 py-4 text-slate-500">${escapeHtmlJS(String(u.created_at || '').slice(0, 10))}</td>
        <td class="px-6 py-4 text-center">
          <div class="flex items-center justify-center gap-3">
            ${actions}
          </div>
        </td>
      </tr>
    `;
  }).join('');

  const usersById = new Map(adminUsersCache.map((user) => [user.id, user]));
  tbody.querySelectorAll('[data-admin-action]').forEach((button) => {
    button.addEventListener('click', () => {
      const user = usersById.get(button.dataset.userId);
      if (!user) return;
      if (button.dataset.adminAction === 'status') {
        toggleUserStatus(user.id, button.dataset.value);
      } else if (button.dataset.adminAction === 'role') {
        toggleUserRole(user.id, button.dataset.value);
      } else if (button.dataset.adminAction === 'password') {
        resetUserPassword(user.id, user.email || '');
      }
    });
  });
}

async function openRecurringForm(id) {
  const item = (DB.recurring || []).find((x) => String(x.id) === String(id));
  const cur = item || { tipe: 'Pengeluaran', kategori: '', nominal: '', dayOfMonth: 1, keterangan: '', active: true };
  const optsFor = (tipe) => {
    const list = tipe === 'Pemasukan' ? (DB.categories.pemasukan || []) : (DB.categories.pengeluaran || []);
    return (list.length ? list : ['Lainnya']).map((c) => `<option value="${escapeHtmlJS(c)}" ${c === cur.kategori ? 'selected' : ''}>${escapeHtmlJS(c)}</option>`).join('');
  };

  const res = await Swal.fire({
    title: item ? 'Edit Jadwal Rutin' : t('rec.add'),
    html: `
      <div class="text-left space-y-2 text-sm">
        <label for="rec-tipe" class="block font-semibold">Tipe</label>
        <select id="rec-tipe" class="swal2-input" style="margin:0;width:100%">
          <option value="Pengeluaran" ${cur.tipe === 'Pengeluaran' ? 'selected' : ''}>Pengeluaran</option>

        <label for="rec-kat" class="block font-semibold">Kategori</label>
        <select id="rec-kat" class="swal2-input" style="margin:0;width:100%">${optsFor(cur.tipe)}</select>

        <label for="rec-day" class="block font-semibold">Tanggal Eksekusi Setiap Bulan (1-31)</label>
        <input id="rec-day" type="number" min="1" max="31" value="${escapeHtmlJS(cur.dayOfMonth || 1)}" class="swal2-input" style="margin:0;width:100%">
        <label for="rec-ket" class="block font-semibold">Catatan</label>
        <input id="rec-ket" type="text" value="${escapeHtmlJS(cur.keterangan)}" class="swal2-input" style="margin:0;width:100%" placeholder="Contoh: Internet Rumah">
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: t('btn.simpan'),
    cancelButtonText: t('btn.batal'),
    customClass: { popup: getSwalClass() },
    didOpen: () => {
      const tipeSel = document.getElementById('rec-tipe');
      const katSel = document.getElementById('rec-kat');
      if (tipeSel && katSel) {
        tipeSel.addEventListener('change', () => {
          katSel.innerHTML = optsFor(tipeSel.value);
        });
      }
    },
    preConfirm: () => {
      const tipe = document.getElementById('rec-tipe').value;
      const kategori = document.getElementById('rec-kat').value;
      const nominal = parseFloat(document.getElementById('rec-nom').value);
      const dayOfMonth = parseInt(document.getElementById('rec-day').value, 10);
      const keterangan = document.getElementById('rec-ket').value.trim();
      if (!kategori || !Number.isFinite(nominal) || nominal <= 0 || !dayOfMonth || dayOfMonth < 1 || dayOfMonth > 31) {
        Swal.showValidationMessage('Periksa tipe, kategori, nominal, dan tanggal (1-31).');
        return false;
      }
      return { id: item ? item.id : undefined, tipe, kategori, nominal, dayOfMonth, keterangan, active: String(cur.active) !== 'false' && cur.active !== false };
    }
  });
  if (!res.isConfirmed || !res.value) return;
  try {
    await refreshFromServer(await callServer('api_saveRecurring', res.value));
    Swal.fire({ icon: 'success', title: t('alert.saved'), timer: 1200, showConfirmButton: false, customClass: { popup: getSwalClass() } });
  } catch (e) { showActionError(e); }

const GEMINI_KEY_STORAGE = 'mk_gemini_api_key';

async function configureGeminiApiKey() {
  const existing = getGeminiApiKey();
  const res = await Swal.fire({
    title: 'API Key Google Gemini',
    html: `
      <div class="text-left text-xs space-y-2">
        <p class="text-slate-500 dark:text-slate-400">Masukkan Gemini API Key dari Google AI Studio. Key disimpan secara lokal di browser Anda dan hanya dipakai ketika Anda menekan tombol <b>Analisis Arus Keuangan</b>.</p>
        <input id="swal-gemini-key" type="password" class="swal2-input" style="margin:6px 0 0;width:100%" placeholder="${existing ? '•••••••••••• (tersimpan — ketik baru untuk mengganti)' : 'AIza...'}">
      </div>
    `,
    showCancelButton: true,
    showDenyButton: Boolean(existing),
    denyButtonText: 'Hapus API Key',
    denyButtonColor: '#e11d48',
    confirmButtonText: t('btn.simpan'),
    cancelButtonText: t('btn.batal'),
    customClass: { popup: getSwalClass() },
    preConfirm: () => {
      const val = (document.getElementById('swal-gemini-key').value || '').trim();
      if (!val) {
        Swal.showValidationMessage('Masukkan API Key Gemini terlebih dahulu.');
        return false;
      }
      return val;
    }
  });

  if (res.isDenied) {
    localStorage.removeItem(GEMINI_KEY_STORAGE);
    updateAiKeyStatusUI();
    Swal.fire({ icon: 'info', title: 'API Key dihapus', timer: 1200, showConfirmButton: false, customClass: { popup: getSwalClass() } });
    return '';
  }

  if (res.isConfirmed && res.value) {
    localStorage.setItem(GEMINI_KEY_STORAGE, res.value);
    updateAiKeyStatusUI();
    Swal.fire({ icon: 'success', title: 'API Key disimpan di browser', timer: 1200, showConfirmButton: false, customClass: { popup: getSwalClass() } });
    return res.value;
  }
  return '';
}

async function runAiCashflowAnalysis() {
  let apiKey = getGeminiApiKey();
  if (!apiKey) {
    apiKey = await configureGeminiApiKey();
    if (!apiKey) return;
  }

  const btn = document.getElementById('btnRunAiAnalysis');
  const box = document.getElementById('aiAnalysisResult');
  if (!box) return;

  if (btn) btn.disabled = true;
  box.classList.remove('hide');
  box.innerHTML = `
    <div class="flex items-center gap-3 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 text-sm text-slate-600 dark:text-slate-300">
      <div class="w-5 h-5 border-2 border-brand border-t-transparent rounded-full animate-spin shrink-0"></div>
      <span>${escapeHtmlJS(t('ai.loading'))}</span>
    </div>
  `;

  try {
    const payload = FinanceAnalysis.buildAiCashflowPayload(DB, DB.currentPeriod, DB.payrollDay);
    const prompt = FinanceAnalysis.buildGeminiCashflowPrompt(payload, currentLang);

    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': apiKey
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          temperature: 0.3,
          responseMimeType: 'application/json'
        }
      })
    });

    const json = await response.json();
    if (!response.ok) {
      const msg = (json && json.error && json.error.message) || ('HTTP ' + response.status);
      throw new Error(msg);
    }

    const rawText = (((json || {}).candidates || [])[0] || {}).content?.parts?.map((p) => p.text || '').join('') || '';
    if (!rawText) throw new Error('Gemini tidak mengembalikan respons teks.');

    const parsed = FinanceAnalysis.parseGeminiCashflowResponse(rawText);
    renderAiCashflowResult(parsed, payload);
  } catch (err) {
    console.error('runAiCashflowAnalysis error:', err);
    box.innerHTML = `
      <div class="p-4 rounded-2xl bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-900/40 text-xs text-rose-700 dark:text-rose-300 flex items-center justify-between gap-3">
        <span>Gagal menjalankan analisis AI: ${escapeHtmlJS(String(err.message || err))}</span>
        <button type="button" onclick="document.getElementById('aiAnalysisResult').classList.add('hide')" class="px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 font-bold shrink-0">Tutup</button>
      </div>
    `;
  } finally {
    if (btn) btn.disabled = false;
  }
}

function renderAiCashflowResult(parsed, payload) {
  const box = document.getElementById('aiAnalysisResult');
  if (!box) return;

  const score = parsed.healthScore;
  const scoreColor = score === null
    ? 'bg-brand text-white'
    : score >= 75
      ? 'bg-emerald-600 text-white'
      : score >= 50
        ? 'bg-amber-500 text-white'
        : 'bg-rose-600 text-white';

  const renderBullets = (items, emptyText) => {
    if (!items || !items.length) {
      return emptyText ? `<p class="text-xs text-slate-500 dark:text-slate-400">${escapeHtmlJS(emptyText)}</p>` : '';
    }
    return '<ul class="space-y-1.5 text-xs text-slate-700 dark:text-slate-300 list-disc pl-4">' +
      items.map((item) => `<li>${escapeHtmlJS(item)}</li>`).join('') +
      '</ul>';
  };

  box.innerHTML = `
    <div class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-3">
          ${score !== null ? `<div class="w-12 h-12 rounded-2xl ${scoreColor} flex flex-col items-center justify-center shrink-0 font-black"><span class="text-lg leading-none">${score}</span><span class="text-[9px] opacity-80">/100</span></div>` : ''}
          <div>
            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${escapeHtmlJS(t('ai.score'))} · ${escapeHtmlJS(payload.period)}</p>
            <p class="text-base font-bold text-slate-800 dark:text-white">${escapeHtmlJS(parsed.statusLabel || 'Hasil Analisis')} <span class="text-xs font-medium text-slate-500 dark:text-slate-400">(Savings Rate: ${escapeHtmlJS(payload.savingsRate)}%)</span></p>
          </div>
        </div>
        <button type="button" onclick="document.getElementById('aiAnalysisResult').classList.add('hide')" class="min-h-10 px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:border-brand self-start sm:self-center">Tutup</button>
      </div>

      ${parsed.ringkasan ? `<p class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">${escapeHtmlJS(parsed.ringkasan)}</p>` : ''}

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="p-4 rounded-2xl bg-blue-50/60 dark:bg-blue-500/10 border border-blue-100 dark:border-blue-900/30">
          <h4 class="text-xs font-bold uppercase tracking-wider text-blue-700 dark:text-blue-400 mb-2">${escapeHtmlJS(t('ai.highlights'))}</h4>
          ${renderBullets(parsed.sorotan, '-')}
        </div>
        <div class="p-4 rounded-2xl bg-amber-50/60 dark:bg-amber-500/10 border border-amber-100 dark:border-amber-900/30">
          <h4 class="text-xs font-bold uppercase tracking-wider text-amber-700 dark:text-amber-400 mb-2">${escapeHtmlJS(t('ai.alerts'))}</h4>
          ${renderBullets(parsed.bocorAnggaran, t('ai.no_alerts'))}
        </div>
        <div class="p-4 rounded-2xl bg-emerald-50/60 dark:bg-emerald-500/10 border border-emerald-100 dark:border-emerald-900/30">
          <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-2">${escapeHtmlJS(t('ai.recommendations'))}</h4>
          ${renderBullets(parsed.rekomendasi, '-')}
        </div>
      </div>
    </div>
  `;
}
</script>
