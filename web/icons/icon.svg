<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Wallet Body -->
  <g transform="translate(96, 120)">
    <rect x="0" y="40" width="320" height="210" rx="32" fill="url(#walletGrad)" />
    <!-- Wallet Flap -->
    <path d="M 0 50 C 0 30, 20 20, 50 20 L 270 20 C 300 20, 320 30, 320 50 L 320 90 L 0 90 Z" fill="#e2e8f0" opacity="0.8" />
    <!-- Wallet Clasp -->
    <rect x="220" y="115" width="100" height="60" rx="18" fill="#1e293b" />
    <!-- Clasp Button (Gold Coin) -->
    <circle cx="250" cy="145" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="4" />
    <!-- Sparkles -->
    <path d="M 280 20 L 290 0 L 300 20 L 320 30 L 300 40 L 290 60 L 280 40 L 260 30 Z" fill="#fef08a" />
    <path d="M 20 230 L 26 215 L 32 230 L 47 236 L 32 242 L 26 257 L 20 242 L 5 236 Z" fill="#fef08a" opacity="0.9" />
  </g>
</svg>
