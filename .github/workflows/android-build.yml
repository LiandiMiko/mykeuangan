name: Build Android APK & AAB (Capacitor 8)
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Jenis paket Android yang ingin dibangun
        required: true
        default: debug-apk
        type: choice
        options:
          - debug-apk
          - release-apk
          - release-aab
          - all
      publish_release:
        description: Publikasikan APK ke GitHub Releases (otomatis aktif saat push ke main / tag v*)
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve build config
        id: cfg
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const bt='${{ inputs.build_type }}' || 'all'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build_type=' + bt + '\nversion=' + pkg.version + '\n');"

      - name: Setup Android 16 (API 36) SDK & Build-Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Siapkan web/config.js (fallback env vars)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e "const fs=require('fs'); if(!fs.existsSync('web/config.js') && process.env.SUPABASE_URL && process.env.SUPABASE_ANON_KEY){ fs.writeFileSync('web/config.js', 'window.APP_CONFIG = ' + JSON.stringify({ SUPABASE_URL: process.env.SUPABASE_URL, SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY }) + ';\n'); }"
          if [ ! -f web/config.js ]; then
            echo "::error::web/config.js tidak ditemukan. Tambahkan GitHub Repository Variables SUPABASE_URL dan SUPABASE_ANON_KEY di Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Build production web bundle
        run: npm run build:prod

      - name: Generate Play Store graphic assets (512x512 & 1024x500)
        run: npm run playstore:assets

      - name: Upload Play Store assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: mykeuguech-playstore-assets
          path: playstore-assets/
          retention-days: 30

      - name: Initialize, patch, and sync Capacitor Android (API 36)
        run: |
          test -d android || npx cap add android
          node scripts/patch-android-project.mjs
          npm run cap:assets
          npx cap sync android
          node scripts/patch-android-project.mjs
          chmod +x android/gradlew

      - name: Restore persistent CI debug keystore
        id: debug_ks_cache
        if: steps.cfg.outputs.build_type == 'debug-apk' || steps.cfg.outputs.build_type == 'all'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure persistent CI debug keystore
        if: steps.cfg.outputs.build_type == 'debug-apk' || steps.cfg.outputs.build_type == 'all'
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Save persistent CI debug keystore
        if: (steps.cfg.outputs.build_type == 'debug-apk' || steps.cfg.outputs.build_type == 'all') && steps.debug_ks_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build Debug APK (untuk test langsung di HP)
        if: steps.cfg.outputs.build_type == 'debug-apk' || steps.cfg.outputs.build_type == 'all'
        run: |
          DEBUG_SHA256="$({ keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android 2>/dev/null | awk '/SHA-?256:/ {print $2; exit}'; } || true)"
          echo "DEBUG_CERT_SHA256=${DEBUG_SHA256:-unavailable}" >> "$GITHUB_ENV"
          (cd android && ./gradlew assembleDebug)
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/MyKeuGuech-v${{ steps.cfg.outputs.version }}-debug.apk"

      - name: Upload Debug APK artifact
        if: steps.cfg.outputs.build_type == 'debug-apk' || steps.cfg.outputs.build_type == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: mykeuguech-android-debug-apk
          path: release/MyKeuGuech-v${{ steps.cfg.outputs.version }}-debug.apk
          retention-days: 30

      - name: Build Signed Release APK & AAB
        id: release_pkg
        if: steps.cfg.outputs.build_type == 'release-apk' || steps.cfg.outputs.build_type == 'release-aab' || steps.cfg.outputs.build_type == 'all'
        env:
          BUILD_TYPE: ${{ steps.cfg.outputs.build_type }}
          APP_VERSION: ${{ steps.cfg.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "has_release_apk=false" >> "$GITHUB_OUTPUT"
            echo "has_release_aab=false" >> "$GITHUB_OUTPUT"
            if [ "$BUILD_TYPE" = "release-apk" ] || [ "$BUILD_TYPE" = "release-aab" ]; then
              echo "::error::Secrets keystore Android belum lengkap (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Lihat docs/ANDROID_PLAYSTORE_GUIDE.md."
              exit 1
            fi
            echo "::warning::Secrets keystore belum diatur; build release APK/AAB dilewati dan hanya debug APK yang dibuat."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/mykeuguech-upload.jks
          RELEASE_SHA256="$({ keytool -list -v -keystore android/mykeuguech-upload.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | awk '/SHA-?256:/ {print $2; exit}'; } || true)"
          echo "RELEASE_CERT_SHA256=${RELEASE_SHA256:-unavailable}" >> "$GITHUB_ENV"
          node -e "const fs=require('fs'); fs.writeFileSync('android/keystore.properties', ['storeFile=mykeuguech-upload.jks', 'storePassword=' + process.env.ANDROID_KEYSTORE_PASSWORD, 'keyAlias=' + process.env.ANDROID_KEY_ALIAS, 'keyPassword=' + process.env.ANDROID_KEY_PASSWORD, ''].join('\n'));"
          HAS_APK=false
          HAS_AAB=false
          mkdir -p release
          if [ "$BUILD_TYPE" = "release-apk" ] || [ "$BUILD_TYPE" = "all" ]; then
            (cd android && ./gradlew assembleRelease)
            cp android/app/build/outputs/apk/release/app-release.apk "release/MyKeuGuech-v${APP_VERSION}-release.apk"
            HAS_APK=true
          fi
          if [ "$BUILD_TYPE" = "release-aab" ] || [ "$BUILD_TYPE" = "all" ]; then
            (cd android && ./gradlew bundleRelease)
            cp android/app/build/outputs/bundle/release/app-release.aab "release/MyKeuGuech-v${APP_VERSION}-release.aab"
            HAS_AAB=true
          fi
          echo "has_release_apk=$HAS_APK" >> "$GITHUB_OUTPUT"
          echo "has_release_aab=$HAS_AAB" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        if: steps.release_pkg.outputs.has_release_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mykeuguech-android-release-apk
          path: release/MyKeuGuech-v${{ steps.cfg.outputs.version }}-release.apk
          retention-days: 30

      - name: Upload Release AAB artifact
        if: steps.release_pkg.outputs.has_release_aab == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mykeuguech-android-release-aab
          path: release/MyKeuGuech-v${{ steps.cfg.outputs.version }}-release.aab
          retention-days: 30

      - name: Bersihkan file keystore sementara
        if: always()
        run: rm -f android/mykeuguech-upload.jks android/keystore.properties

      - name: Publish APK to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          shopt -s nullglob
          RELEASE_APKS=(release/*-release.apk)
          APKS=("${RELEASE_APKS[@]}")
          IS_RELEASE_APK=true
          if [ ${#APKS[@]} -eq 0 ]; then
            APKS=(release/*.apk)
            IS_RELEASE_APK=false
          fi
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::warning::Tidak ada berkas .apk di release/ untuk dipublikasikan ke GitHub Releases."
            exit 0
          fi
          TAG_NAME="${GITHUB_REF_NAME:-v${APP_VERSION}}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            TAG_NAME="v${APP_VERSION}"
          fi
          node - <<'EOF' > /tmp/release-notes.md
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('dist/version.json', 'utf8'));
          const lines = ['## ' + (m.releaseTitle || ('MyKeuGuech v' + m.version)), ''];
          (m.notes || []).forEach((n) => lines.push('- ' + n));
          lines.push(
            '',
            '### Cara Update di Android',
            '1. Unduh berkas `.apk` di bagian **Assets** di bawah.',
            '2. Buka berkas APK lalu pilih **Update / Pasang** (tanpa uninstall agar pengaturan lokal tetap tersimpan).'
          );
          process.stdout.write(lines.join('\n') + '\n');
          EOF
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ "$IS_RELEASE_APK" = "true" ]; then
              gh release delete-asset "$TAG_NAME" "MyKeuGuech-v${APP_VERSION}-debug.apk" --yes 2>/dev/null || true
            fi
            gh release upload "$TAG_NAME" "${APKS[@]}" --clobber
            gh release edit "$TAG_NAME" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG_NAME" "${APKS[@]}" --target "$GITHUB_SHA" --title "MyKeuGuech ${TAG_NAME}" --notes-file /tmp/release-notes.md --latest
          fi

      - name: Tulis ringkasan build
        if: success()
        env:
          HAS_RELEASE_APK: ${{ steps.release_pkg.outputs.has_release_apk }}
        run: |
          if [ "$HAS_RELEASE_APK" = "true" ]; then
            SIGN_TRACK="Signed Release Keystore (Permanen)"
            CERT_SHA256="${RELEASE_CERT_SHA256:-unavailable}"
          else
            SIGN_TRACK="Cached CI Debug Keystore (konsisten selama cache 7 hari aktif)"
            CERT_SHA256="${DEBUG_CERT_SHA256:-unavailable}"
          fi
          {
            echo "## Android Build Summary (v${{ steps.cfg.outputs.version }})"
            echo ""
            echo "- **Signing Track**: ${SIGN_TRACK}"
            echo "- **Signing Cert SHA-256**: \`${CERT_SHA256}\`"
            echo ""
            echo '```text'
            ls -lh release/
            echo '```'
            echo ""
            echo "### Langkah Install & Uji di HP Android"
            echo "1. Unduh artifact **mykeuguech-android-release-apk** / **mykeuguech-android-debug-apk** di bawah halaman run ini, atau langsung dari **GitHub Releases** (\`releases/latest\`)."
            echo "2. Buka \`.apk\` di HP Android untuk menimpa versi sebelumnya tanpa uninstall (selama APK lama di HP memakai sertifikat SHA-256 yang sama; jika sebelumnya terpasang build lama sebelum cache/release keystore aktif, uninstall 1x lalu install build ini)."
            echo "3. Setiap push ke \`main\`, tag \`v*\`, atau opsi \`publish_release\` otomatis menerbitkan berkas \`.apk\` ke **GitHub Releases** (\`releases/latest\`) untuk popup in-app update."
            echo "4. Untuk signature permanen lintas bulan & rilis Play Store, generate upload keystore via \`npm run cap:keystore\` lalu isi 4 GitHub Secrets (\`ANDROID_KEYSTORE_*\`)."
            echo "5. Pastikan Redirect URL Supabase Auth sudah menyertakan \`com.mykeuguech.app://auth-callback\` agar Login Google kembali ke aplikasi."
          } >> "$GITHUB_STEP_SUMMARY"
