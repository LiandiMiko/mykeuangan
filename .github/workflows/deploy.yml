name: CI & Deploy ke GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact: ${{ steps.artifact_meta.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (npm ci)
        # Gelombang 5.2: package-lock.json kini ada + build.mjs memakai
        # esbuild (devDependency) untuk minifikasi. Tanpa install,
        # build.mjs fallback tanpa minifikasi — dist yang diuji/di-deploy
        # CI akan berbeda dari build lokal. `npm ci` memakai lockfile
        # (gagal bila lockfile tidak sinkron dengan package.json).
        run: npm ci --no-audit --no-fund
      - name: Fetch self-hosted vendor assets
        # Wave 3.4 / S25: fetch vendor BERJALAN JUGA di PR (dulu hanya di
        # deploy) — DAN SEBELUM `npm run check`. Test 3.4 menyalin repo ke
        # direktori temp dan menjalankan build di sana; tanpa web/vendor/
        # di checkout, 7 dari 8 test 3.4 gagal (ENOENT) di CI padahal lolos
        # di mesin dev yang vendor-nya sudah terunduh. Build juga butuh
        # tailwind.min.css (gerbang vendor di build.mjs), jadi langkah
        # Tailwind ikut dipindah ke sebelum check.
        run: node scripts/fetch-vendors.mjs
      - run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i web/tailwind-input.css -o web/vendor/tailwind.min.css --minify
      - run: npm run check
      - name: Siapkan config fallback (jika belum ada)
        env:
          # Gelombang 4: nilai ini pindah dari GitHub Variables ke
          # Secrets (Variables bisa dibaca siapa pun yang punya akses
          # baca repo settings; Secrets tidak). Buat dulu
          # SUPABASE_URL + SUPABASE_ANON_KEY di Settings -> Secrets
          # and variables -> Actions -> Secrets (nilai yang sama
          # dengan yang sudah ada di web/config.js).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e "const fs=require('fs'); if(!fs.existsSync('web/config.js') && process.env.SUPABASE_URL && process.env.SUPABASE_ANON_KEY){ fs.writeFileSync('web/config.js', 'window.APP_CONFIG = ' + JSON.stringify({ SUPABASE_URL: process.env.SUPABASE_URL, SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY }) + ';\n'); }"
      - name: Build dist (PR check)
        if: github.event_name == 'pull_request'
        # Gelombang 5.1: TANPA syarat config.js. Dulu langkah ini hanya
        # jalan bila web/config.js ada — bila file itu hilang, PR lolos
        # CI tanpa pernah membangun dist, sementara job deploy gagal
        # lantang. config.js ter-track di repo; bila ia hilang, build
        # harus GAGAL di PR juga (build.mjs melempar error yang jelas),
        # bukan diam-diam dilewati.
        run: |
          node build.mjs
          test -f dist/index.html
      - name: Build dist (Deploy)
        if: github.event_name != 'pull_request'
        run: |
          node build.mjs
          test -f dist/index.html
          ls -la dist
      - name: Smoke test dist (artefak yang di-deploy)
        # Gelombang 5.1: yang diuji CI harus sama dengan yang di-deploy.
        # `npm run check` menguji sumber dan build.mjs punya gerbangnya
        # sendiri — langkah ini menegaskan bentuk AKHIR dist/: versi
        # cocok dengan package.json, tanpa CDN, vendor lokal lengkap,
        # sw.js + delete-account.html ikut tersalin. Jalan di PR maupun
        # push, sebelum artefak di-upload ke Pages.
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const fail = (m) => { console.error('SMOKE FAIL: ' + m); process.exit(1); };
          if (!fs.existsSync('dist/index.html')) fail('dist/index.html tidak ada');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (html.length < 100000) fail(`dist/index.html hanya ${html.length} byte (bundle tidak lengkap?)`);
          if (!html.includes(`<meta name="app-version" content="${pkg.version}">`)) fail(`meta app-version bukan ${pkg.version}`);
          for (const cdn of ['cdn.jsdelivr.net', 'unpkg.com', 'cdnjs.cloudflare.com', 'cdn.tailwindcss.com', 'fonts.googleapis.com', 'fonts.gstatic.com']) {
            // Hanya tag resource (src/href) yang dilarang — pola yang sama
            // dipakai gerbang build.mjs. Nama host boleh muncul di teks
            // lain (mis. CSP connect-src mengizinkan cdn.jsdelivr.net).
            const m = html.match(new RegExp(`(?:src|href)\\s*=\\s*"https://${cdn.replace(/\./g, '\\.')}[^"]*"`, 'i'));
            if (m) fail(`tag resource CDN tersisa di dist/index.html: ${m[0]}`);
          }
          if (!html.includes('./vendor/')) fail('dist/index.html tidak merujuk vendor lokal (./vendor/)');
          if (!fs.existsSync('dist/version.json')) fail('dist/version.json tidak ada');
          const ver = JSON.parse(fs.readFileSync('dist/version.json', 'utf8'));
          if (ver.version !== pkg.version) fail(`dist/version.json ${ver.version} != package.json ${pkg.version}`);
          if (!Number.isInteger(ver.versionCode) || ver.versionCode <= 0) fail('dist/version.json versionCode tidak valid');
          if (!fs.existsSync('dist/sw.js')) fail('dist/sw.js tidak ada');
          if (fs.readFileSync('dist/sw.js', 'utf8').includes('__BUILD_ID__')) fail('dist/sw.js masih berisi placeholder __BUILD_ID__');
          if (!fs.existsSync('dist/delete-account.html')) fail('dist/delete-account.html tidak ada');
          if (!fs.existsSync('dist/manifest.webmanifest')) fail('dist/manifest.webmanifest tidak ada');
          for (const v of ['supabase.js']) {
            if (!fs.existsSync(`dist/vendor/${v}`) || fs.statSync(`dist/vendor/${v}`).size === 0) fail(`dist/vendor/${v} hilang/kosong`);
          }
          // Gelombang 7b (T12): tailwind.min.css TIDAK lagi di-inline —
          // build menautkannya sebagai <link> ke dist/vendor/ (lihat
          // build.mjs). Yang dicek: file CSS hasil kompilasi tersalin,
          // berisi header Tailwind, dan ditaut dari index.html.
          if (!fs.existsSync('dist/vendor/tailwind.min.css') || fs.statSync('dist/vendor/tailwind.min.css').size === 0) fail('dist/vendor/tailwind.min.css hilang/kosong');
          if (!fs.readFileSync('dist/vendor/tailwind.min.css', 'utf8').includes('/*! tailwindcss v')) fail('dist/vendor/tailwind.min.css bukan hasil kompilasi Tailwind');
          if (!html.includes('./vendor/tailwind.min.css')) fail('dist/index.html tidak menautkan ./vendor/tailwind.min.css');
          // Gelombang 7b (T12): modul app dieksternalisasi ke dist/app/.
          if (!fs.existsSync('dist/app/config.js')) fail('dist/app/config.js tidak ada (eksternalisasi 7b rusak?)');
          if (!fs.existsSync('dist/app/i18n-dict.js')) fail('dist/app/i18n-dict.js tidak ada (eksternalisasi 7b rusak?)');
          if (!fs.existsSync('dist/app/sw-register.js')) fail('dist/app/sw-register.js tidak ada (eksternalisasi 7b rusak?)');
          if (html.includes('<script>')) fail('blok <script> inline tersisa di dist/index.html (eksternalisasi 7b rusak?)');
          console.log(`✅ Smoke dist OK: index.html ${(html.length / 1024).toFixed(0)} KB, v${ver.version} (${ver.versionCode}), tanpa CDN, vendor lokal lengkap.`);
          NODE
      - id: artifact_meta
        if: github.event_name != 'pull_request'
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.name }}
          path: ./dist

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.verify.outputs.pages_artifact }}
